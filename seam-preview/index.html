          const base = (garmentFileName || "").replace(
            /\.garment\..*\.json$/,
            "",
          );
          name = base ? `${base}.seam.reviewed.json` : "seam.reviewed.json";
        }
        const blob = new Blob([JSON.stringify(seam, null, 2)], {
          type: "application/json",
        });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = name;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 500);
        toast(
          `已保存: ${name}（${seam.stitches.length} 条缝合关系）`,
        );
      }

      // 保存裁片语义：将修改后的 panel.role 序列化为 Garment JSON 下载。
      // 文件名沿用加载时的 garmentFileName（默认 {base}.garment.reviewed.json），
      // 与系统其他模块（语义库 / seam-preview）对 garment JSON 的约定保持一致。
      function saveGarmentJson() {
        if (!garment) {
          toast("未加载 Garment 数据");
          return;
        }
        let name = garmentFileName || "garment.reviewed.json";
        if (!/\.json$/i.test(name)) name = name + ".json";
        let json;
        try {
          json = JSON.stringify(garment, null, 2);
        } catch (e) {
          toast("保存失败：Garment 数据无法序列化");
          return;
        }
        const blob = new Blob([json], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = name;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 500);
        // 保存成功后以当前 role 作为新的“原始值”（撤销基于保存后的状态），并清除临时草稿
        panelOriginalRoleMap = new Map();
        for (const p of garment.panels || []) {
          panelOriginalRoleMap.set(p.panel_id, p.role || "");
        }
        clearDraft();
        updateDirtyBadge();
        toast(`已保存裁片语义: ${name}（${garment.panels.length} 裁片）`);
      }

      // ============ 人工缝合 - 交互控制 ============
      const manualStitchBtn = $("#manualStitchBtn");
      const rubberBand = $("#rubberBand");
      const manualStatusEl = $("#manualStatus");
      const manualSideTag = $("#manualSideTag");
      const manualInfoEl = $("#manualInfo");
      // 画布工具：pan = 移动画布，select = 选边
      let currentTool = "pan";
      const toolPanBtn = $("#toolPanBtn");
      const toolSelectBtn = $("#toolSelectBtn");

      // 切换鼠标工具并同步按钮选中态与光标
      function setTool(tool) {
        currentTool = tool;
        toolPanBtn.classList.toggle("active", tool === "pan");
        toolSelectBtn.classList.toggle("active", tool === "select");
        updateCanvasCursor();
      }

      // 依据当前工具 + 人工模式设置画布光标
      function updateCanvasCursor() {
        const panning = currentTool === "pan";
        svg.classList.toggle("grabbable", panning);
        if (panning) {
          svg.style.cursor = "";
        } else {
          svg.style.cursor = manualMode.active ? "crosshair" : "";
        }
      }
      const manualActiveBanner = $("#manualActiveBanner");
      let manualAreaRect = null;

      // 人工缝合模式状态指示
      function setManualModeIndicator(show) {
        if (show) {
          manualActiveBanner.classList.add("show");
          manualStitchBtn.classList.add("active");
        } else {
          manualActiveBanner.classList.remove("show");
          manualStitchBtn.classList.remove("active");
          manualStatusEl.textContent = "就绪";
          manualSideTag.textContent = "0";
          // 确认缝合已常驻底部状态栏，退出人工模式时需复位禁用
          $("#manualConfirmBtn").disabled = true;
        }
        updateCanvasCursor(); // 光标由当前工具决定
      }

      function manualArea() {
        return document.getElementById("canvasArea").getBoundingClientRect();
      }

      function manualExit() {
        // 退出人工缝合工具，保留已建关系（仅撤掉工具态与选择）
        manualMode.active = false;
        manualMode.box = null;
        manualMode.selections = [];
        manualMode.selectedIdx = -1;
        manualMode.dragging = false;
        manualMode.pendingCapHalf = null;
        rubberBand.classList.remove("show");
        setManualModeIndicator(false);
        renderCanvas();
        refreshManualSelectionPanel(); // 退出时隐藏已选边列表
      }

      function manualClearSelection() {
        // 重置：清除当前所有已选中的组边，回到“零选择”状态，工具保持激活
        manualMode.box = null;
        manualMode.selections = [];
        manualMode.selectedIdx = -1;
        manualMode.dragging = false;
        rubberBand.classList.remove("show");
        renderCanvas();
        updateManualBar();
      }

      function manualCancel() {
        // 撤销最近一次添加的组边（Esc 用）；无选择时退出工具
        if (manualMode.selections.length) {
          manualMode.selections.pop();
          manualMode.selectedIdx = -1;
        }
        updateManualBar();
        renderCanvas();
      }

      // 移除指定索引的已选组边
      function removeSelectedChain(idx) {
        if (idx < 0 || idx >= manualMode.selections.length) return;
        manualMode.selections.splice(idx, 1);
        if (manualMode.selectedIdx === idx) manualMode.selectedIdx = -1;
        else if (manualMode.selectedIdx > idx) manualMode.selectedIdx--;
        updateManualBar();
        renderCanvas();
      }

      function updateManualBar() {
        if (!manualMode.active) {
          manualActiveBanner.classList.remove("show");
          return;
        }
        manualActiveBanner.classList.add("show");
        const n = manualMode.selections.length;
        const confirmBtn = $("#manualConfirmBtn");
        manualSideTag.textContent = String(n);
        manualSideTag.classList.toggle("b", false);
        if (n === 0) {
          manualStatusEl.textContent =
            "请框选组边（可多次框选累积多条，点击/悬停栏可移除）";
          confirmBtn.disabled = true;
          manualInfoEl.textContent = "";
        } else if (n === 1) {
          manualStatusEl.textContent =
            "已选 1 条组边，可继续框选更多，或多选 2 条以上后确认互缝";
          confirmBtn.disabled = true;
          const s = manualMode.selections[0];
          manualInfoEl.textContent = `#1 ${s.panelId} · ${s.edgeIds.length} 边 · ${s.length.toFixed(0)}mm`;
        } else {
          manualStatusEl.textContent =
            `已选 ${n} 条组边，点击“确认缝合”建立多对多互缝关系`;
          confirmBtn.disabled = false;
          const parts = manualMode.selections
            .map((s, i) => `#${i + 1} ${s.panelId}·${s.length.toFixed(0)}mm`)
            .join(" ；");
          manualInfoEl.textContent = parts;
        }
        // 已选边列表与选择状态实时同步
        refreshManualSelectionPanel();
      }

      function showRubberBand() {
        rubberBand.classList.add("show");
      }

      // 已选边列表栏：从 manualMode.selections 实时展示所有已选组边
      const manualSelectedPanel = $("#manualSelectedPanel");
      const manualSelectedList = $("#manualSelectedList");
      const manualSelectedCount = $("#manualSelectedCount");
      function refreshManualSelectionPanel() {
        if (!manualMode.active) {
          manualSelectedPanel.classList.remove("show");
          manualSelectedList.innerHTML = "";
          manualSelectedCount.textContent = "0";
          return;
        }
        const chains = manualMode.selections;
        // 统计所有已选小边数量
        const totalEdges = chains.reduce((s, c) => s + c.edgeIds.length, 0);
        manualSelectedCount.textContent = String(totalEdges);
        if (!chains.length) {
          manualSelectedPanel.classList.add("show");
          manualSelectedList.innerHTML =
            '<div class="msp-empty">框选组边以累积选择（可多次框选）</div>';
          return;
        }
        manualSelectedPanel.classList.add("show");
        manualSelectedList.innerHTML = chains
          .map((c, i) => {
            // 以“由多组小边组合而成的大边(edge_group)”为语义展示基准
            const panel = (garment?.panels || []).find(
              (p) => p.panel_id === c.panelId,
            );
            const gidSet = new Set(c.groupIds || []);
            const selGroups = panel
              ? edgeGroupsOfPanel(panel).filter((g) =>
                  gidSet.has(g.group_id),
                )
              : [];
            return `<div class="selected-edge-group${i === manualMode.selectedIdx ? " sel-active" : ""}" data-idx="${i}">
        <div class="seg-header">
          <span class="seg-side" style="background:${chainColor(i)}">${i + 1}</span>
          <span class="seg-title" title="${esc(c.panelId)}">${esc(c.panelId)}</span>
          <span class="seg-count">${c.edgeIds.length} 小边 / ${c.length.toFixed(0)}mm</span>
          <button type="button" class="seg-remove" data-del-idx="${i}" title="移除该组边">×</button>
        </div>
        <div class="seg-list">
          ${
            selGroups.length
              ? selGroups
                  .map((g) => {
                    const sname = edgeSemanticName(g.role);
                    const gLabel = "大边 " + String(g.group_id).split(".").pop();
                    return `<div class="selected-edge-item" data-group="${esc(g.group_id)}" title="${esc(g.group_id)}">
            <span class="e-dot" style="background:${chainColor(i)}"></span>
            <span class="e-id" title="大边 ${esc(g.group_id)} · ${g.member_edge_ids.length} 段小边">${esc(gLabel)}</span>
            <span class="e-sem">${g.member_edge_ids.length} 段</span>
            ${sname ? `<span class="e-sem" title="语义：${esc(sname)}">${esc(sname)}</span>` : ""}
          </div>`;
                  })
                  .join("")
              : (c.edgeIds || [])
                  .map(
                    (eid) => `<div class="selected-edge-item" data-edge="${esc(eid)}">
            <span class="e-dot" style="background:${chainColor(i)}"></span>
            <span class="e-id" title="${esc(eid)}">${esc(eid)}</span>
          </div>`,
                  )
                  .join("")
          }
        </div>
      </div>`;
          })
          .join("");
      }

      function refreshRubberBand() {
        const b = manualMode.box;
        if (!b) return;
        const x = Math.min(b.x0, b.x1);
        const y = Math.min(b.y0, b.y1);
        rubberBand.style.left = x + "px";
        rubberBand.style.top = y + "px";
        rubberBand.style.width = Math.abs(b.x1 - b.x0) + "px";
        rubberBand.style.height = Math.abs(b.y1 - b.y0) + "px";
      }
      function hideRubberBand() {
        rubberBand.classList.remove("show");
      }

      // 计算一条选择链的语义摘要：{panelSem: 裁片语义中文名, edgeSems: {语义名: 大边条数}}
      // 以“由多组小边组合而成的大边(edge_group)”为语义统计基准。
      function chainSemanticInfo(sel) {
        const edgeSems = {};
        for (const gid of sel.groupIds || []) {
          const role = groupRoleById(sel.panelId, gid);
          const sname = edgeSemanticName(role) || "未分类边";
          edgeSems[sname] = (edgeSems[sname] || 0) + 1;
        }
        // 裁片语义：以链所属面板的 role 解析
        let panelSem = "";
        const panel = (garment?.panels || []).find(
          (p) => p.panel_id === sel.panelId,
        );
        if (panel) panelSem = panelSemanticName(panel.role) || "";
        return { panelSem, edgeSems };
      }

      // 一次框选 → 命中 → 扩选 → 追加为一条新组边到选择集（多选累积）
      function applyBoxSelection(b) {
        const hits = selectionFromBox(b.x0, b.y0, b.x1, b.y1);
        if (!hits.length) {
          toast("未选中任何边，请重新框选");
          return;
        }
        const sel = chainExpand(hits);
        if (!sel) {
          toast("未能形成有效边链");
          return;
        }
        // 语义即时提示：选中后立即展示选中边的完整语义名称摘要
        const sinfo = chainSemanticInfo(sel);
        const semParts = Object.entries(sinfo.edgeSems)
          .map(([k, n]) => (n > 1 ? `${k}×${n}` : k))
          .join("、");
        const selPanelName = sinfo.panelSem
          ? `${sel.panelId}（${sinfo.panelSem}）`
          : sel.panelId;
        toast(
          `已选中 ${sel.edgeIds.length} 条小边（${sel.groupIds.length} 条大边）：${selPanelName}\n大边语义：${
            semParts || "未分类"
          }`,
        );
        // 袖山弧线智能分割：若为袖片拱形弧，在最高点切成前/后两半。
        // 前半立即加入选择集用于配对，后半暂存 pending，配好前半后自动带入。
        const capHalves = trySplitSleeveCap(sel);
        if (capHalves.length === 2) {
          manualMode.pendingCapHalf = capHalves[1];
          addSelectionChain(capHalves[0], true);
          toast(
            `袖山弧线已按最高点分割：前半已选入 #${manualMode.selections.length}，` +
              `配好前半后会自动带入后半继续配对`,
          );
        } else {
          // 若之前有暂存的后半已由用户手动再次框选，则忽略旧的 pending 以免重复
          if (sameChain(manualMode.pendingCapHalf, sel)) manualMode.pendingCapHalf = null;
          addSelectionChain(sel, false);
        }
        updateManualBar();
        renderCanvas();
      }

      // 通用：把一条链加入选择集（支持替换式去重，可选覆盖提示）
      function addSelectionChain(sel, silent) {
        // 去重：若新链与已选组边共享任意小边，则替换而非追加（避免重复计数）
        const dupIdx = manualMode.selections.findIndex((c) =>
          c.edgeIds.some((eid) => sel.edgeIds.includes(eid)),
        );
        if (dupIdx >= 0) {
          manualMode.selections[dupIdx] = sel;
          if (!silent) toast(`已更新组边 #${dupIdx + 1}`);
        } else {
          // 冲突提示（不阻断）：所选边可能已被现有缝合关系占用
          if (!silent) {
            const conflicts = occupiedByStitch(sel.edgeIds);
            if (conflicts.length) {
              const names = conflicts
                .map((s) => s.stitch_id || s.type || "stitch")
                .join("、");
              toast(`提示：所选边已参与 ${names}，可继续但请注意重复`);
            }
          }
          manualMode.selections.push(sel);
          manualMode.selectedIdx = manualMode.selections.length - 1;
        }
      }

      // 判断两条选择链是否覆盖相同的边集合（用于去重/忽略 pending）
      function sameChain(a, b) {
        if (!a || !b || !a.edgeIds || !b.edgeIds) return false;
        if (a.edgeIds.length !== b.edgeIds.length) return false;
        const setB = new Set(b.edgeIds);
        return a.edgeIds.every((e) => setB.has(e));
      }

      // 多对多：取缝合关系中各参与组边的边数组（edge_sets，回退兼容 a_edges/b_edges）
      function stitchSideEdgeGroups(s) {
        if (s && Array.isArray(s.edge_sets) && s.edge_sets.length) {
          return s.edge_sets.map((gs) => gs.edge_ids || gs.edges || []);
        }
        return [s?.a_edges || [], s?.b_edges || []];
      }

      // 取缝合关系涉及的全部小边 id（含多对多情况）
      function stitchAllEdges(s) {
        return stitchSideEdgeGroups(s).flat();
      }

      // 返回占用给定边的现有缝合关系
      function occupiedByStitch(edgeIds) {
        if (!seam || !seam.stitches) return [];
        const occ = new Set(edgeIds);
        return seam.stitches.filter((s) =>
          stitchAllEdges(s).some((e) => occ.has(e)),
        );
      }

      // 校验并生成 stitch_id
      function nextStitchId() {
        let max = 0;
        for (const s of seam?.stitches || []) {
          const m = /stitch_(\d+)$/.exec(s.stitch_id || "");
          if (m) max = Math.max(max, parseInt(m[1], 10));
        }
        return `stitch_${String(max + 1).padStart(3, "0")}`;
      }

      // 生成 point_matches（按端点距离最小化选择方向）
      function buildPointMatches(A, B) {
        const a0 = A.edgeIds[0];
        const a1 = A.edgeIds[A.edgeIds.length - 1];
        const b0 = B.edgeIds[0];
        const b1 = B.edgeIds[B.edgeIds.length - 1];
        const dist = ([p1, p2]) => Math.hypot(p1[0] - p2[0], p1[1] - p2[1]);
        // 正向：a首-b首，a尾-b尾；反向：a首-b尾，a尾-b首
        const straight = dist(A.startPoint, B.startPoint) + dist(A.endPoint, B.endPoint);
        const crossed = dist(A.startPoint, B.endPoint) + dist(A.endPoint, B.startPoint);
        if (straight <= crossed) {
          return [
            { a: { edge_id: a0, endpoint: "start" }, b: { edge_id: b0, endpoint: "start" } },
            { a: { edge_id: a1, endpoint: "end" }, b: { edge_id: b1, endpoint: "end" } },
          ];
        }
        return [
          { a: { edge_id: a0, endpoint: "start" }, b: { edge_id: b1, endpoint: "end" } },
          { a: { edge_id: a1, endpoint: "end" }, b: { edge_id: b0, endpoint: "start" } },
        ];
      }

      // 二次确认弹窗入口：点击“确认缝合”后弹出，经用户确认才真正建立关系
      function manualConfirm() {
        const chains = manualMode.selections;
        if (chains.length < 2) {
          toast("请至少框选 2 条组边后再确认缝合");
          return;
        }
        // 同裁片校验：同一非袖片裁片只能出现一条组边；
        // 袖片允许同裁片上的多条（前/后袖缝等）互缝
        const byPanel = {};
        for (const c of chains) {
          (byPanel[c.panelId] = byPanel[c.panelId] || []).push(c);
        }
        for (const pid in byPanel) {
          if (byPanel[pid].length > 1 && !isSleevePanel(pid)) {
            toast(
              `裁片「${pid}」出现了多个组边（非袖片），请仅保留其一后重选`,
            );
            return;
          }
        }
        const desc = chains
          .map(
            (c, i) =>
              `#${i + 1}「${c.panelId}」（${c.edgeIds.length} 边 / ${c.length.toFixed(0)}mm）`,
          )
          .join(" 与 ");
        openConfirmModal(
          "确认多对多缝合关系",
          `确定要为以下 ${chains.length} 条组边建立相互缝合关联吗？\n${desc}` +
            `\n\n确认后将写入缝合关系 JSON（多对多 seam_group），需保存后才永久生效。`,
          () => createManualStitch(),
          {
            confirmText: `确认缝合（${chains.length} 条）`,
            confirmClass: "primary",
          },
        );
      }

      // 判断裁片是否为袖片（role 含 'sleeve'），允许其同裁片前后袖缝互缝
      function isSleevePanel(panelId) {
        const p = (garment?.panels || []).find((x) => x.panel_id === panelId);
        return !!(p && /sleeve/i.test(p.role || ""));
      }

      function createManualStitch() {
        const chains = manualMode.selections.slice();
        if (chains.length < 2) return;
        const stitchId = nextStitchId();
        const finite = (v) => Number.isFinite(v) ? v : 0;

        // 通用多对多数据：edge_sets 记录每条参与组边（含裁片、边、组、端点、长度）
        const edge_sets = chains.map((c, i) => ({
          chain_index: i,
          panel_id: c.panelId,
          edge_ids: c.edgeIds.slice(),
          group_ids: (c.groupIds || []).slice(),
          start_point: c.startPoint.slice(),
          end_point: c.endPoint.slice(),
          length: finite(c.length),
        }));

        // 兼容字段：主链为第一条，其余合并为 b 侧（便于旧消费者读取）
        const A = chains[0];
        const B = { edgeIds: chains.slice(1).flatMap((c) => c.edgeIds) };
        const aLen = finite(A.length);
        const bLen = chains.slice(1).reduce((s, c) => s + finite(c.length), 0);
        const minLen = Math.max(Math.min(aLen, bLen), 1);
        // 多对多：所有参与组边两两配对索引（完全互缝）
        const paired_indices = [];
        for (let i = 0; i < chains.length; i++) {
          for (let j = i + 1; j < chains.length; j++) {
            paired_indices.push([i, j]);
          }
        }
        const stitch = {
          stitch_id: stitchId,
          type: "seam",
          relation: chains.length === 2 ? "seam_pair" : "seam_group",
          a: A.edgeIds[0],
          b: chains.length > 1 ? chains[1].edgeIds[0] : A.edgeIds[0],
          a_edges: A.edgeIds,
          b_edges: B.edgeIds,
          a_groups: A.groupIds,
          b_groups: chains.slice(1).flatMap((c) => c.groupIds || []),
          // 多对多核心结构
          edge_sets,
          paired_indices, // 组边索引对：互相缝合关系
          direction: "by_points",
          point_matches:
            chains.length >= 2 ? buildPointMatches(A, chains[1]) : [],
          length_tolerance: Math.abs(aLen - bLen) / minLen,
          confidence: 1,
          review_status: "pending_review",
          source: "manual",
        };
        seam = seam || { schema_version: 1, garment_id: "", status: "draft", stitches: [] };
        if (!Array.isArray(seam.stitches)) seam.stitches = [];
        seam.stitches.unshift(stitch);
        toast(`已添加人工缝合关系 ${stitchId}（${chains.length} 条组边互缝）`);
        // 若存在袖山分割暂存的后半弧，把它自动带入下一轮选择，便于紧接着配后半与另一侧袖窿
        const pending = manualMode.pendingCapHalf;
        manualMode.pendingCapHalf = null;
        manualClearSelection();
        if (pending && manualMode.active) {
          addSelectionChain(pending, true);
          toast(
            `已自动带入袖山后半（#${manualMode.selections.length}），` +
              `请继续框选另一侧袖窿以完成配对`,
          );
        }
        updateSaveBtn();
        renderAll();
        updateManualBar();
      }

      // 工具开关
      manualStitchBtn.onclick = () => {
        if (!garment) {
          toast("请先加载 Garment JSON");
          return;
        }
        if (!manualMode.active) {
          manualMode.active = true;
          setManualModeIndicator(true);
          setTool("select"); // 进入人工缝合默认切到“选边”
          if (manualAdj && Object.keys(manualAdj).length === 0) {
            buildManualAdjacency();
          }
          updateManualBar();
        } else {
          manualExit();
        }
      };
      $("#manualResetBtn").onclick = manualClearSelection;
      $("#manualConfirmBtn").onclick = manualConfirm;

      // 袖山弧线分割开关
      $("#splitCapBtn").onclick = () => {
        manualMode.splitCap = !manualMode.splitCap;
        manualMode.pendingCapHalf = null;
        updateSplitCapBtn();
      };
      function updateSplitCapBtn() {
        const btn = $("#splitCapBtn");
        if (!btn) return;
        btn.classList.toggle("active", manualMode.splitCap);
        btn.textContent = manualMode.splitCap ? "袖山分割" : "不分割";
      }
      updateSplitCapBtn();

      // 移动画布 / 选边 工具切换
      toolPanBtn.onclick = () => setTool("pan");
      toolSelectBtn.onclick = () => setTool("select");

      // 已选边列表交互（容器级事件委托）：
      //     点击各组边 → 切换该组边高亮；点击 × → 立即移除（不再二次确认）
      manualSelectedList.addEventListener("click", (e) => {
        const btn = e.target.closest("[data-del-idx]");
        const item = e.target.closest("[data-idx]");
        if (btn) {
          removeSelectedChain(parseInt(e.target.closest("[data-del-idx]").dataset.delIdx, 10));
          return;
        }
        if (item) {
          const idx = parseInt(item.dataset.idx, 10);
          manualMode.selectedIdx =
            manualMode.selectedIdx === idx ? -1 : idx;
          updateManualBar();
          renderCanvas();
        }
      });

      // 画布框选交互（人工模式）
      const mArea = document.getElementById("canvasArea");
      mArea.addEventListener("pointerdown", (e) => {
        if (!manualMode.active || currentTool !== "select") return;
        // 点击操作条/工具切换栏时不应触发框选
        if (
          e.target &&
          e.target.closest &&
          e.target.closest(".canvas-footer")
        ) {
          return;
        }
        manualAreaRect = manualArea();
        e.preventDefault();
        e.stopPropagation();
        manualMode.dragging = true;
        const x = e.clientX - manualAreaRect.left;
        const y = e.clientY - manualAreaRect.top;
        manualMode.box = { x0: x, y0: y, x1: x, y1: y };
        showRubberBand();
        refreshRubberBand();
        try {
          mArea.setPointerCapture(e.pointerId);
        } catch (err) {
          /* 合成事件可能抛错，忽略 */
        }
      });
      mArea.addEventListener("pointermove", (e) => {
        if (!manualMode.active || !manualMode.dragging || !manualMode.box) return;
        e.preventDefault();
        e.stopPropagation();
        const r = manualAreaRect || manualArea();
        manualMode.box.x1 = e.clientX - r.left;
        manualMode.box.y1 = e.clientY - r.top;
        refreshRubberBand();
      });
      mArea.addEventListener("pointerup", (e) => {
        if (!manualMode.active || !manualMode.dragging) return;
        e.preventDefault();
        e.stopPropagation();
        manualMode.dragging = false;
        hideRubberBand();
        const b = manualMode.box;
        manualMode.box = null;
        if (!b) return;
        // 忽略过小的拖拽（视为点击），避免误触发
        const w = Math.abs(b.x1 - b.x0);
        const h = Math.abs(b.y1 - b.y0);
        if (w < 4 && h < 4) return;
        applyBoxSelection(b);
      });

      // ============ 文件加载 ============
      function loadGarmentJson(jsonData, fileName) {
        if (!jsonData.panels || !Array.isArray(jsonData.panels)) {
          throw new Error("Garment JSON 缺少 panels 数组");
        }
        garment = jsonData;
        garmentFileName = fileName || garment.garment_id || "";
        // 记录每裁片加载时的原始 role，供“裁片语义”编辑器撤销还原
        panelOriginalRoleMap = new Map();
        for (const p of garment.panels || []) {
          panelOriginalRoleMap.set(p.panel_id, p.role || "");
        }
        // 新加载数据后，清空上一份数据的撤销栈，并恢复同名文件的临时草稿
        semEditHistory = [];
        const restored = restoreDraft();
        rebuildGeometry();
        buildEdgeLookup();
        buildManualAdjacency();
        manualClearSelection();
        focusedPanelId = null;
        updateCanvasSize();
        fitToCanvas();
        renderAll();
        toast(
          `已加载: ${garmentFileName || garment.garment_id} (${garment.panels.length} 裁片)${
            restored > 0
              ? `，并恢复 ${restored} 个临时语义修改`
              : ""
          }`,
        );
      }

      function loadSeamJson(jsonData, fileName) {
        if (!jsonData.stitches || !Array.isArray(jsonData.stitches)) {
          throw new Error("Seam JSON 缺少 stitches 数组");
        }
        seam = jsonData;
        seamFileName = fileName || "";
        hoveredStitchId = null;
        renderAll();
        toast(`已加载: ${seam.stitches.length} 条缝合关系`);
      }

      function loadFile(file, kind) {
        const reader = new FileReader();
        reader.onload = () => {
          try {
            const data = JSON.parse(reader.result);
            if (kind === "garment") {
              loadGarmentJson(data, file.name);
            } else {
              loadSeamJson(data, file.name);
            }
          } catch (e) {
            toast(`JSON 解析失败: ${e.message}`);
          }
        };
        reader.readAsText(file, "utf-8");
      }

      // 批量加载：自动匹配 garment 和 seam 文件
      // 兼容两种命名：{base}.garment.reviewed.json（人工标注）与 {base}.reviewed.garment.json（自动标注工具）
      function batchLoad(files) {
        const garmentFiles = [];
        const seamFiles = [];
        const pairs = [];

        for (const file of files) {
          const name = file.name;
          if (name.includes(".garment.")) {
            garmentFiles.push(file);
          } else if (name.includes(".seam.")) {
            seamFiles.push(file);
          }
        }

        // 配对：去掉 .garment.xxx.json / .seam.xxx.json 段后的基名一致即可
        for (const gf of garmentFiles) {
          const base = gf.name.replace(/\.garment\..*\.json$/, "");
          const sf = seamFiles.find(
            (f) => f.name.replace(/\.seam\..*\.json$/, "") === base,
          );
          if (sf) {
            pairs.push({ garment: gf, seam: sf, name: base });
          }
        }

        if (pairs.length === 0) {
          // 退而求其次：直接加载
          if (garmentFiles.length > 0) loadFile(garmentFiles[0], "garment");
          if (seamFiles.length > 0) loadFile(seamFiles[0], "seam");
          if (garmentFiles.length === 0 && seamFiles.length === 0) {
            toast("未找到 garment.json 或 seam.json 文件");
          }
          return;
        }

        // 加载第一对
        if (pairs.length > 1) {
          toast(`找到 ${pairs.length} 对文件，已加载第一对: ${pairs[0].name}`);
        }
        loadFile(pairs[0].garment, "garment");
        setTimeout(() => loadFile(pairs[0].seam, "seam"), 100);
      }

      // ============ 事件绑定 ============
      $("#loadGarmentBtn").onclick = () => $("#garmentFile").click();
      $("#loadSeamBtn").onclick = () => $("#seamFile").click();
      $("#batchLoadBtn").onclick = () => $("#batchFile").click();
      $("#saveBtn").onclick = saveSeamJson;
      // 顶栏“保存 Garment JSON”：将裁片语义导出为 JSON（与侧栏编辑器的保存共用同一逻辑）
      $("#saveGarmentBtn").onclick = saveGarmentJson;
      // 语义编辑栏右上角关闭：取消选中，关闭右侧编辑栏
      $("#pseCloseBtn").onclick = () => {
        focusedPanelId = null;
        renderAll();
      };

      // 缝合关系删除按钮 - 容器级事件委托，重渲染后依然生效
      $("#stitchList").addEventListener("click", (e) => {
        const btn = e.target.closest("[data-delete]");
        if (!btn) return;
        e.stopPropagation();
        deleteStitch(btn.dataset.delete);
      });

      // 确认弹窗
      $("#modalConfirmBtn").onclick = () => {
        const cb = modalOnConfirm;
        closeModal();
        if (cb) cb();
      };
      $("#modalCancelBtn").onclick = closeModal;
      modalOverlay.addEventListener("click", (e) => {
        if (e.target === modalOverlay) closeModal();
      });
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") {
          if (modalOverlay.classList.contains("show")) {
            closeModal();
          } else if (manualMode.active) {
            if (manualMode.selections.length) {
              manualCancel();
            } else {
              manualExit();
            }
          }
        }
      });

      $("#garmentFile").onchange = (e) => {
        if (e.target.files[0]) loadFile(e.target.files[0], "garment");
        e.target.value = "";
      };
      $("#seamFile").onchange = (e) => {
        if (e.target.files[0]) loadFile(e.target.files[0], "seam");
        e.target.value = "";
      };
      $("#batchFile").onchange = (e) => {
        if (e.target.files.length) batchLoad([...e.target.files]);
        e.target.value = "";
      };

      // 拖拽加载 - 阻止浏览器默认行为
      ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(evt => {
        document.body.addEventListener(evt, (e) => {
          e.preventDefault();
          e.stopPropagation();
        });
      });

      const canvasArea = document.querySelector('.canvas-area');
      canvasArea.addEventListener('dragover', (e) => {
        e.preventDefault();
        e.stopPropagation();
        canvasArea.style.background = '#dbeafe';
      });
      canvasArea.addEventListener('dragleave', (e) => {
        e.preventDefault();
        e.stopPropagation();
        canvasArea.style.background = '';
      });
      canvasArea.addEventListener('drop', (e) => {
        e.preventDefault();
        e.stopPropagation();
        canvasArea.style.background = '';
        const files = [...e.dataTransfer.files].filter(f => f.name.endsWith('.json'));
        if (files.length === 0) { toast('请拖入 JSON 文件'); return; }
        if (files.length === 1) {
          const name = files[0].name;
          if (name.includes('.garment.reviewed.json') || name.includes('.garment.')) {
            loadFile(files[0], 'garment');
          } else if (name.includes('.seam.reviewed.json') || name.includes('.seam.')) {
            loadFile(files[0], 'seam');
          } else {
            loadFile(files[0], 'garment');
          }
        } else {
          batchLoad(files);
        }
      });

      // 标签/缝合线开关
      $("#showLabels").onchange = (e) => {
        showLabels = e.target.checked;
        $("#labelToggle").classList.toggle("active", showLabels);
        renderCanvas();
      };
      $("#showSeams").onchange = (e) => {
        showSeams = e.target.checked;
        $("#seamToggle").classList.toggle("active", showSeams);
        renderCanvas();
      };
      $("#showEdgeSemantics").onchange = (e) => {
        showEdgeSemantics = e.target.checked;
        $("#edgeSemanticToggle").classList.toggle("active", showEdgeSemantics);
        renderCanvas();
      };

      // 缩放/平移
      $("#fitBtn").onclick = fitToCanvas;
      $("#zoomInBtn").onclick = () => {
        const cx = svgW / 2, cy = svgH / 2;
        const old = transform.k;
        transform.k = Math.min(8, old * 1.2);
        transform.x = cx - (cx - transform.x) * transform.k / old;
        transform.y = cy - (cy - transform.y) * transform.k / old;
        updateTransform();
      };
      $("#zoomOutBtn").onclick = () => {
        const cx = svgW / 2, cy = svgH / 2;
        const old = transform.k;
        transform.k = Math.max(0.05, old / 1.2);
        transform.x = cx - (cx - transform.x) * transform.k / old;
        transform.y = cy - (cy - transform.y) * transform.k / old;
        updateTransform();
      };

      // SVG 滚轮缩放
      svg.addEventListener(
        "wheel",
        (e) => {
          e.preventDefault();
          const r = svg.getBoundingClientRect();
          const mx = e.clientX - r.left;
          const my = e.clientY - r.top;
          const old = transform.k;
          const next = Math.max(
            0.05,
            Math.min(8, old * (e.deltaY < 0 ? 1.12 : 0.89)),
          );
          transform.x = mx - ((mx - transform.x) * next) / old;
          transform.y = my - ((my - transform.y) * next) / old;
          transform.k = next;
          updateTransform();
        },
        { passive: false },
      );

      // SVG 拖拽平移（仅在空白区域；工具为“移动画布”时启用，选边时禁用）
      svg.addEventListener("pointerdown", (e) => {
        if (currentTool !== "pan") return;
        if (e.target === svg || e.target === viewport) {
          dragState = {
            x: e.clientX,
            y: e.clientY,
            tx: transform.x,
            ty: transform.y,
          };
          svg.setPointerCapture(e.pointerId);
          svg.classList.add("dragging");
        }
      });
      svg.addEventListener("pointermove", (e) => {
        if (dragState) {
          transform.x = dragState.tx + (e.clientX - dragState.x);
          transform.y = dragState.ty + (e.clientY - dragState.y);
          updateTransform();
        }
      });
      svg.addEventListener("pointerup", () => {
        dragState = null;
        svg.classList.remove("dragging");
      });

      // 响应窗口大小变化
      window.addEventListener("resize", () => {
        updateCanvasSize();
        renderCanvas();
      });

      // 初始渲染（延迟一帧确保布局完成）
      requestAnimationFrame(() => {
        updateCanvasSize();
        renderAll();
        fitToCanvas();
      });
    </script>
  </body>
</html>
