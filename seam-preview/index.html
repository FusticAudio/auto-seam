      let sdRegistry = null; // 顶点注册表（加载 Garment 时重建）
      let pointMatchVisible = false; // 点对应虚线可视开关（点击缝合关系时默认开启）
      const sdCache = new Map(); // stitch_id -> 方向详情数据（LRU，上限 20）
      const SD_CACHE_MAX = 20;
      // 缝合关系 item 级编辑基线：stitch_id -> 最近一次保存时的完整序列化快照（JSON 字符串）。
      // 用于“重置当前 item”恢复到最近一次保存状态，与面包屑式的已保存状态保持一致。
      const stitchItemBaseline = new Map();
      // 存在尚未“保存当前 item 修改”的缝合关系集合（用于“未保存”徽标提示）
      const dirtyStitchSet = new Set();

      // 记录某缝合关系最新保存基线（完整快照）并清除其未保存标记
      function commitStitchItemBaseline(stitch) {
        if (!stitch) return;
        stitchItemBaseline.set(stitch.stitch_id, JSON.stringify(stitch));
        dirtyStitchSet.delete(stitch.stitch_id);
      }
      // 标记某缝合关系存在未保存修改
      function markStitchItemDirty(stitchId) {
        if (!stitchId) return;
        dirtyStitchSet.add(stitchId);
        updateSdDirtyBadge();
      }
      // 同步“未保存”徽标：仅当前选中 item 存在未保存修改时展示
      function updateSdDirtyBadge() {
        const badge = $("#sdDirtyBadge");
        if (badge)
          badge.hidden = !(
            selectedStitchId && dirtyStitchSet.has(selectedStitchId)
          );
      }
      // 将当前选中缝合关系恢复到最近一次保存的状态（重置）。
      // 通过对比当前快照与基线判断是否有变更，仅在有变更时执行回滚并重渲染。
      function resetSelectedStitchItem() {
        const stitchId = selectedStitchId;
        if (!stitchId || !seam || !Array.isArray(seam.stitches)) return;
        const idx = seam.stitches.findIndex((x) => x.stitch_id === stitchId);
        if (idx < 0) return;
        const baseline = stitchItemBaseline.get(stitchId);
        if (!baseline) {
          toast("该缝合关系没有可重置的保存状态");
          return;
        }
        const current = JSON.stringify(seam.stitches[idx]);
        if (current === baseline) {
          toast("当前 item 无未保存修改");
          updateSdDirtyBadge();
          return;
        }
        // 恢复基线快照（深克隆），保证起点/终点/边序等全部字段回退到最近一次保存状态
        seam.stitches[idx] = JSON.parse(baseline);
        dirtyStitchSet.delete(stitchId);
        sdClearCache();
        renderCanvas();
        showStitchDirection(stitchId);
        recordSeamChange(
          "编辑缝合关系",
          stitchId,
          {},
          {},
          [{ field: `item 状态`, from: "已修改", to: "已重置" }],
          `重置缝合关系 ${stitchId} 到最近一次保存的状态`,
        );
      }
      // 保存当前选中缝合关系的所有编辑：以当前状态作为新的“最近保存”基线。
      // （编辑已就地写入 seam.stitches，此处仅固化基线，供后续重置与持久化区分）
      function saveSelectedStitchItem() {
        const stitchId = selectedStitchId;
        if (!stitchId || !seam || !Array.isArray(seam.stitches)) return;
        const stitch = seam.stitches.find((x) => x.stitch_id === stitchId);
        if (!stitch) return;
        commitStitchItemBaseline(stitch);
        updateSdDirtyBadge();
        recordSeamChange(
          "编辑缝合关系",
          stitchId,
          {},
          {},
          [{ field: `item 状态`, from: "未保存", to: "已保存" }],
          `保存缝合关系 ${stitchId} 的修改`,
        );
        toast(`已保存 ${stitchId} 的当前修改`);
      }

      function sdCacheGet(stitchId) {
        if (sdCache.has(stitchId)) {
          const v = sdCache.get(stitchId);
          sdCache.delete(stitchId);
          sdCache.set(stitchId, v); // 重新插入，保持 LRU 顺序
          return v;
        }
        return undefined;
      }
      function sdCacheSet(stitchId, data) {
        if (sdCache.has(stitchId)) sdCache.delete(stitchId);
        sdCache.set(stitchId, data);
        if (sdCache.size > SD_CACHE_MAX) {
          const oldest = sdCache.keys().next().value;
          if (oldest !== undefined) sdCache.delete(oldest); // 淘汰最久未使用，防内存泄漏
        }
      }
      function sdClearCache() {
        sdCache.clear();
        selectedStitchId = null;
        document.querySelectorAll("[data-stitch]").forEach((el) => {
          el.classList.remove("active");
        });
        updateSdDirtyBadge(); // 选中清空后直隐“未保存”徽标
      }

      function getStitchDirectionData(stitchId) {
        const cached = sdCacheGet(stitchId);
        if (cached) return cached;
        const s = ((seam && seam.stitches) || []).find(
          (x) => x.stitch_id === stitchId,
        );
        if (!s) return null;
        const data = sdCoreBuildDirectionData(s, garment, sdRegistry);
        sdCacheSet(stitchId, data);
        return data;
      }

      // 大边卡片：以“组合边”为单位展示方向详情（维持原卡片式视觉风格）
      function sdCardHtml(g) {
        const sideCls =
          g.side === "A"
            ? "sd-badge-a"
            : g.side === "B"
              ? "sd-badge-b"
              : "sd-badge-role";
        const sideTxt = /^组\d+$/.test(g.side) ? g.side : g.side + "侧";
        const roleName = g.role
          ? edgeSemanticName(g.role) || "未收录:" + g.role
          : "";
        const memberCount = g.member_edge_ids ? g.member_edge_ids.length : 0;
        const head =
          '<div class="sd-card-head">' +
          '<span class="sd-edge-name" title="' +
          esc(g.label) +
          '">' +
          esc(
            g.side === "A" || g.side === "B"
              ? g.side + "侧大边"
              : g.side + "大边",
          ) +
          "</span>" +
          '<span class="sd-badge ' +
          sideCls +
          '">' +
          esc(sideTxt) +
          "</span>" +
          (roleName
            ? '<span class="sd-badge sd-badge-role">' +
              esc(roleName) +
              "</span>"
            : "") +
          '<span class="sd-badge sd-badge-match">' +
          memberCount +
          " 条小边</span>" +
          "</div>";
        const arrowSvg =
          '<svg class="sd-dir-arrow" width="14" height="14" viewBox="0 0 16 16" aria-hidden="true">' +
          '<path d="M2 8h10M9 4l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
        const ptRow = (label, dot, p) => {
          const coord = p && p.point ? sdCoreFmtCoord(p.point) : "—";
          return (
            '<div class="sd-pt-row">' +
            '<span class="sd-pt-dot ' +
            dot +
            '" aria-hidden="true"></span>' +
            '<span class="sd-pt-label">' +
            label +
            "</span>" +
            '<span class="sd-pt-name">' +
            esc(p ? p.name : "未知顶点") +
            "</span>" +
            '<span class="sd-pt-id">' +
            esc(p ? p.id : "-") +
            "</span>" +
            '<span class="sd-pt-coord">' +
            esc(coord) +
            "</span>" +
            "</div>"
          );
        };
        const members =
          g.member_edge_ids && g.member_edge_ids.length
            ? '<div class="sd-members">' +
              g.member_edge_ids
                .map(
                  (id) =>
                    '<span class="sd-member-chip" title="' +
                    esc(id) +
                    '">' +
                    esc(id) +
                    "</span>",
                )
                .join("") +
              "</div>"
            : "";
        return (
          '<div class="sd-card">' +
          head +
          '<div class="sd-card-body">' +
          '<div class="sd-pt-triples">' +
          ptRow("起点", "sd-dot-start", g.start) +
          ptRow("终点", "sd-dot-end", g.end) +
          "</div>" +
          members +
          '<div class="sd-dir-row">' +
          arrowSvg +
          '<span class="sd-dir-text" title="' +
          esc(g.direction) +
          '">' +
          esc(g.direction) +
          "</span></div>" +
          "</div></div>"
        );
      }

      function renderStitchDirection(data) {
        const body = $("#sdBody");
        const countEl = $("#sdEdgeCount");
        if (!data) {
          body.innerHTML = '<div class="empty-state">未找到该缝合关系</div>';
          countEl.textContent = "0";
          return;
        }
        const groupCount = (data.groups || []).length;
        countEl.textContent = groupCount;
        let html =
          '<div class="sd-summary">缝合关系 <b>' +
          esc(data.stitch_id) +
          "</b> · " +
          esc(data.relation) +
          " · 涉及 <b>" +
          groupCount +
          "</b> 条大边（" +
          (data.edges || []).length +
          " 条小边）</div>";
        const groups = data.groups || [];
        for (let i = 0; i < groups.length; i++)
          html += sdCardHtml(groups[i]);
        html += sdPointMatchSectionHtml(data);
        body.innerHTML = html;
        // 淡入淡出过渡（300ms）：先移除动画类→强制回流→重新添加以重启动画
        void body.offsetWidth;
        body.classList.add("sd-fade");
      }

      // ============ 曲线组端点对应（点对应）核心逻辑 ============
      // 端点定义沿用 project 的缝边数据模型：每条边的起点/终点即 DXF 物理端点，
      // 大边（组边）的组起点 = 首条成员小边起点、组终点 = 末条成员小边终点；
      // 点对应（point_matches）以 {edge_id, endpoint} 表达 A 侧与 B 侧端点的对应关系。

      // `${edge_id}|${endpoint}` 引用值序列化 / 解析
      function sdCoreRefValue(ref) {
        return ref && ref.edge_id && ref.endpoint
          ? ref.edge_id + "|" + ref.endpoint
          : "";
      }
      function sdCoreParseRef(value) {
        const v = String(value || "");
        const i = v.lastIndexOf("|");
        return i < 0
          ? { edge_id: "", endpoint: "" }
          : { edge_id: v.slice(0, i), endpoint: v.slice(i + 1) };
      }

      // 解析一个侧别引用（group_id 或 edge:xxx）得到成员小边 id 列表（顺序保留）
      function sdCoreResolveGroupMembers(ref) {
        if (!ref) return [];
        let raw = ref;
        if (/^edge:/i.test(raw)) raw = raw.slice(5);
        if (sdCoreEdgeInfo(garment, raw, sdRegistry)) return [raw]; // 直接是边
        for (const p of garment.panels || []) {
          if (!p) continue;
          const g = (p.edge_groups || []).find((x) => x.group_id === raw);
          if (g && Array.isArray(g.member_edge_ids)) return g.member_edge_ids;
        }
        return [];
      }

      // 某侧的端点引用下拉选项：仅列组起点（首条成员小边的起点）与组终点（末条成员小边的终点）。
      // 参照 project 的 endpointChoices —— 内部小段连接点不参与选择。
      // 注意：滚边条等大边常为单条成员小边（members.length === 1），此时组起点=该边起点、
      // 组终点=该边终点，仍应产出两个独立端点，不能因 `members.length > 1` 丢弃组终点。
      function sdCoreEndpointOptions(stitch, side, reg) {
        const out = [];
        const refs =
          side === "A"
            ? (stitch && stitch.a_groups) || []
            : (stitch && stitch.b_groups) || [];
        for (const ref of refs) {
          const members = sdCoreResolveGroupMembers(ref);
          if (!members.length) {
            console.warn(
              `[点对应] 侧别 ${side} 组引用 "${ref}" 未解析到任何成员边，已跳过`,
            );
            continue;
          }
          const label = ref;
          const first = sdCoreEdgeInfo(garment, members[0], reg);
          // 始终取末条成员边：单成员组时即同一条边（其终点即组终点）
          const last = sdCoreEdgeInfo(
            garment,
            members[members.length - 1],
            reg,
          );
          if (first) {
            out.push({
              value: sdCoreRefValue({
                edge_id: first.edge_id,
                endpoint: "start",
              }),
              label: label + " · 组起点 (" + first.start.name + ")",
            });
          }
          if (last) {
            out.push({
              value: sdCoreRefValue({
                edge_id: last.edge_id,
                endpoint: "end",
              }),
              label: label + " · 组终点 (" + last.end.name + ")",
            });
          }
          if (!first || !last) {
            console.warn(
              `[点对应] 侧别 ${side} 组引用 "${ref}" 端点解析不完整（first=${!!first}, last=${!!last}）`,
            );
          }
        }
        return out;
      }

      // 取某侧别指定端点类型（start/end）的第一个可用引用选项；缺失时回退首个选项
      function sdCoreEndpointChoice(stitch, side, endpoint, reg) {
        const opts = sdCoreEndpointOptions(stitch, side, reg);
        return (
          opts.find((o) => o.value.endsWith("|" + endpoint)) || opts[0] || null
        );
      }

      // 纯函数：按交叉对应规则构建端点对应列表 —— A起点↔B终点、A终点↔B起点
      function sdCoreCrossMatches(aStart, aEnd, bStart, bEnd) {
        const mk = (o) =>
          o ? sdCoreParseRef(o.value) : { edge_id: "", endpoint: "" };
        return [
          { a: mk(aStart), b: mk(bEnd) },
          { a: mk(aEnd), b: mk(bStart) },
        ];
      }

      // 端点选择下拉（自定义 DOM 实现）：原生 select 的展开列表由浏览器绘制，无法捕获选项悬停事件，
      // 故改为按钮 + 列表结构，每个选项为真实 DOM 元素，可触发 mouseover/mouseleave 联动画布端点放大。
      // 选项值沿用 `${edge_id}|${endpoint}` 引用格式，与画布标记的 data-pm-ref 一致。
      // 菜单本体不在 DOM 中内联渲染，展开时由 openCsMenu 动态构建并挂载到 body（portal 模式），
      // 以脱离抽屉/卡片 overflow:hidden 的裁剪；当前选中项仅用于初始化触发器文案。
      function sdEndpointSelectHtml(stitch, side, currentRef, reg, i) {
        const opts = sdCoreEndpointOptions(stitch, side, reg);
        const current = opts.find((o) => o.value === currentRef);
        const label = current ? current.label : "— 请选择端点 —";
        const sideKey = side === "A" ? "a" : "b";
        return (
          '<div class="sd-cs" data-cs-root data-sdpm-side="' +
          sideKey +
          '" data-sdpm-i="' +
          i +
          '">' +
          '<button type="button" class="sd-cs-trigger" data-cs-trigger aria-haspopup="listbox" aria-expanded="false">' +
          '<span class="sd-cs-value">' +
          esc(label) +
          "</span>" +
          '<svg class="sd-cs-arrow" width="10" height="10" viewBox="0 0 16 16" aria-hidden="true">' +
          '<path d="M4 6l4 4 4-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>' +
          "</button>" +
          "</div>"
        );
      }

      // 点对应编辑区（含可视开关）：默认开启虚线（pointMatchVisible），可在侧栏开关控制
      function sdPointMatchSectionHtml(data) {
        if (!data || !data.stitch_id || !seam) return "";
        const stitch = (seam.stitches || []).find(
          (s) => s.stitch_id === data.stitch_id,
        );
        if (!stitch) return "";
        const matches = Array.isArray(stitch.point_matches)
          ? stitch.point_matches
          : [];
        const sw =
          '<label class="sd-switch-row">' +
          '<input type="checkbox" id="sdPmVisible"' +
          (pointMatchVisible ? " checked" : "") +
          ">" +
          '<span class="sd-switch-ui"></span><span>显示点对应虚线</span></label>';
        let rows = "";
        if (matches.length) {
          rows = matches
            .map((m, i) => {
              const aRef = sdCoreRefValue(m && m.a);
              const bRef = sdCoreRefValue(m && m.b);
              return (
                '<div class="sd-match-row">' +
                '<span class="sd-match-idx">' +
                (i + 1) +
                "</span>" +
                '<span class="sd-match-side sd-side-a">A</span>' +
                sdEndpointSelectHtml(stitch, "A", aRef, sdRegistry, i) +
                '<span class="sd-match-arrow">↔</span>' +
                '<span class="sd-match-side sd-side-b">B</span>' +
                sdEndpointSelectHtml(stitch, "B", bRef, sdRegistry, i) +
                '<button type="button" class="mini-btn danger" data-sdpm-del="' +
                i +
                '"' +
                (matches.length <= 1 ? " disabled" : "") +
                ">删除</button>" +
                "</div>"
              );
            })
            .join("");
        } else {
          rows =
            '<div class="sd-match-empty">尚未添加端点对应，请点击下方按钮为缝合方向添加起点/终点对应。</div>';
        }
        const note =
          matches.length < 2 && data.type === "seam"
            ? '<div class="sd-match-note">提示：拼缝建议至少 2 组端点对应以确认缝合方向。</div>'
            : "";
        return (
          '<div class="sd-pm-wrap">' +
          sw +
          '<div class="sd-pm-head">' +
          '<span class="sd-pm-title">曲线组端点对应</span>' +
          '<button type="button" class="mini-btn" data-sdpm-add>＋ 添加点对应</button>' +
          "</div>" +
          '<div class="sd-match-list">' +
          rows +
          "</div>" +
          note +
          "</div>"
        );
      }

      // 添加一组点对应；自动标注时严格遵循交叉对应：
      //   A侧起点 ↔ B侧终点 且  A侧终点 ↔ B侧起点
      // 首次添加（point_matches 为空且 A/B 两侧端点齐全）时一次性自动建立完整交叉对应。
      function addPointMatch(stitchId) {
        const stitch = (seam && seam.stitches || []).find(
          (s) => s.stitch_id === stitchId,
        );
        if (!stitch) return;
        if (!Array.isArray(stitch.point_matches)) stitch.point_matches = [];
        const aOpts = sdCoreEndpointOptions(stitch, "A", sdRegistry);
        const bOpts = sdCoreEndpointOptions(stitch, "B", sdRegistry);
        const aStart = sdCoreEndpointChoice(stitch, "A", "start", sdRegistry);
        const aEnd = sdCoreEndpointChoice(stitch, "A", "end", sdRegistry);
        const bStart = sdCoreEndpointChoice(stitch, "B", "start", sdRegistry);
        const bEnd = sdCoreEndpointChoice(stitch, "B", "end", sdRegistry);

        if (!stitch.point_matches.length && aStart && aEnd && bStart && bEnd) {
          // 自动交叉标注：A起点↔B终点，A终点↔B起点
          stitch.point_matches.push(...sdCoreCrossMatches(aStart, aEnd, bStart, bEnd));
        } else {
          // 已有对应或端点信息不完整：补一条尽量符合交叉约定的缺省对应
          const a = aStart || aEnd || aOpts[0] || null;
          const b = bEnd || bStart || bOpts[0] || null;
          stitch.point_matches.push({
            a: a ? sdCoreParseRef(a.value) : { edge_id: "", endpoint: "" },
            b: b ? sdCoreParseRef(b.value) : { edge_id: "", endpoint: "" },
          });
        }
        stitch.direction = "by_points";
        markStitchItemDirty(stitchId);
        recordSeamChange(
          "编辑缝合关系",
          stitchId,
          {},
          { point_matches: stitch.point_matches.length },
          [],
          `为缝合关系 ${stitchId} 自动标注端点对应（A起点↔B终点、A终点↔B起点交叉）`,
        );
        sdClearCache();
        renderCanvas();
        showStitchDirection(stitchId);
      }

      // 删除一组点对应；至少保留一组
      function removePointMatch(stitchId, index) {
        const stitch = (seam && seam.stitches || []).find(
          (s) => s.stitch_id === stitchId,
        );
        if (!stitch || !Array.isArray(stitch.point_matches)) return;
        if (stitch.point_matches.length <= 1) return;
        stitch.point_matches.splice(index, 1);
        markStitchItemDirty(stitchId);
        recordSeamChange(
          "编辑缝合关系",
          stitchId,
          {},
          { point_matches: stitch.point_matches.length },
          [],
          `删除缝合关系 ${stitchId} 的一组端点对应`,
        );
        sdClearCache();
        renderCanvas();
        showStitchDirection(stitchId);
      }

      // 修改某侧端点对应：重新选择该侧大边的起点或终点
      function setPointMatchEndpoint(stitchId, index, side, value) {
        const stitch = (seam && seam.stitches || []).find(
          (s) => s.stitch_id === stitchId,
        );
        if (!stitch || !Array.isArray(stitch.point_matches)) return;
        const match = stitch.point_matches[index];
        if (!match) return;
        match[side] = sdCoreParseRef(value);
        stitch.direction = "by_points";
        markStitchItemDirty(stitchId);
        recordSeamChange(
          "编辑缝合关系",
          stitchId,
          {},
          { point_matches: stitch.point_matches.length },
          [],
          `修改缝合关系 ${stitchId} 第 ${index + 1} 组端点对应（${side.toUpperCase()} 侧）`,
        );
        sdClearCache();
        renderCanvas();
        showStitchDirection(stitchId);
      }

      // 切换点对应虚线的可视开关
      function togglePointMatchVisible(visible) {
        pointMatchVisible = Boolean(visible);
        renderCanvas();
      }

      function showStitchDirection(stitchId) {
        if (!seam || !seam.stitches || !seam.stitches.length) return;
        const s = seam.stitches.find((x) => x.stitch_id === stitchId);
        if (!s) return;
        // 兼容原列表选择：就地切换高亮（active），不重建列表 DOM，不影响 hover 高亮
        document.querySelectorAll("[data-stitch]").forEach((el) => {
          el.classList.toggle("active", el.dataset.stitch === stitchId);
        });
        selectedStitchId = stitchId;
        // 选中某条缝合关系时，默认开启点对应虚线（可在右侧栏开关中控制）
        pointMatchVisible = true;
        // 自动展开右侧功能栏并定位到方向详情区块
        setRightPanel("sde");
        renderCanvas();
        updateSdDirtyBadge(); // 切换 item 时刷新“未保存”徽标
        const body = $("#sdBody");
        body.classList.remove("sd-fade");
        // 加载状态指示（本地同步计算，一帧内完成渲染）。
        // rAF + setTimeout 双保险：后台/节流标签页中 rAF 可能被暂停，
        // 兜底超时保证 500ms 内必完成渲染。
        body.innerHTML =
          '<div class="sd-loading"><span class="sd-spinner"></span><span>正在加载方向数据…</span></div>';
        let ran = false;
        const done = () => {
          if (ran) return;
          ran = true;
          const data = getStitchDirectionData(stitchId);
          renderStitchDirection(data);
        };
        if (typeof requestAnimationFrame === "function")
          requestAnimationFrame(done);
        setTimeout(done, 50);
      }

      // ============ 文件加载 ============
      function loadGarmentJson(jsonData, fileName) {
        if (!jsonData.panels || !Array.isArray(jsonData.panels)) {
          throw new Error("Garment JSON 缺少 panels 数组");
        }
        garment = jsonData;
        garmentFileName = fileName || garment.garment_id || "";
        // 记录每裁片加载时的原始 role / 自定义名，供“裁片语义”编辑器撤销还原
        panelOriginalRoleMap = new Map();
        panelOriginalNameMap = new Map();
        for (const p of garment.panels || []) {
          panelOriginalRoleMap.set(p.panel_id, p.role || "");
          panelOriginalNameMap.set(p.panel_id, String(p.name || ""));
        }
        // 新加载数据后，清空上一份数据的撤销栈与未保存的临时修改，加载当前文件的修改记录，并恢复同名文件的临时草稿
        semEditHistory = [];
        pendingEdits.clear();
        // 重建顶点注册表并清空方向详情缓存（新裁片数据 -> 新的顶点编号体系）
        sdRegistry = sdCoreBuildRegistry(garment.panels);
        sdClearCache();
        loadHistory();
        const restored = restoreDraft();
        rebuildGeometry();
        buildEdgeLookup();
        buildManualAdjacency();
        manualClearSelection();
        focusedPanelId = null;
        updateCanvasSize();
        fitToCanvas();
        renderAll();
        toast(
          `已加载: ${garmentFileName || garment.garment_id} (${garment.panels.length} 裁片)${
            restored > 0 ? `，并恢复 ${restored} 个临时语义修改` : ""
          }`,
        );
      }

      function loadSeamJson(jsonData, fileName) {
        if (!jsonData.stitches || !Array.isArray(jsonData.stitches)) {
          throw new Error("Seam JSON 缺少 stitches 数组");
        }
        seam = jsonData;
        seamFileName = fileName || "";
        hoveredStitchId = null;
        // 重建 item 级保存基线：加载状态即“最近一次保存”，重置将回退至此
        stitchItemBaseline.clear();
        dirtyStitchSet.clear();
        for (const st of seam.stitches) commitStitchItemBaseline(st);
        // 换了一份缝合数据：清空方向详情缓存与选择态，收起方向详情区块
        sdClearCache();
        if (rightPanelKey === "sde") setRightPanel(null);
        renderAll();
        toast(`已加载: ${seam.stitches.length} 条缝合关系`);
      }

      function loadFile(file, kind) {
        const reader = new FileReader();
        reader.onload = () => {
          try {
            const data = JSON.parse(reader.result);
            if (kind === "garment") {
              loadGarmentJson(data, file.name);
            } else {
              loadSeamJson(data, file.name);
            }
          } catch (e) {
            toast(`JSON 解析失败: ${e.message}`);
          }
        };
        reader.readAsText(file, "utf-8");
      }

      // 批量加载：自动匹配 garment 和 seam 文件
      // 兼容两种命名：{base}.garment.reviewed.json（人工标注）与 {base}.reviewed.garment.json（自动标注工具）
      function batchLoad(files) {
        const garmentFiles = [];
        const seamFiles = [];
        const pairs = [];

        for (const file of files) {
          const name = file.name;
          if (name.includes(".garment.")) {
            garmentFiles.push(file);
          } else if (name.includes(".seam.")) {
            seamFiles.push(file);
          }
        }

        // 配对：去掉 .garment.xxx.json / .seam.xxx.json 段后的基名一致即可
        for (const gf of garmentFiles) {
          const base = gf.name.replace(/\.garment\..*\.json$/, "");
          const sf = seamFiles.find(
            (f) => f.name.replace(/\.seam\..*\.json$/, "") === base,
          );
          if (sf) {
            pairs.push({ garment: gf, seam: sf, name: base });
          }
        }

        if (pairs.length === 0) {
          // 退而求其次：直接加载
          if (garmentFiles.length > 0) loadFile(garmentFiles[0], "garment");
          if (seamFiles.length > 0) loadFile(seamFiles[0], "seam");
          if (garmentFiles.length === 0 && seamFiles.length === 0) {
            toast("未找到 garment.json 或 seam.json 文件");
          }
          return;
        }

        // 加载第一对
        if (pairs.length > 1) {
          toast(`找到 ${pairs.length} 对文件，已加载第一对: ${pairs[0].name}`);
        }
        loadFile(pairs[0].garment, "garment");
        setTimeout(() => loadFile(pairs[0].seam, "seam"), 100);
      }

      // ============ 事件绑定 ============
      $("#loadGarmentBtn").onclick = () => $("#garmentFile").click();
      $("#loadSeamBtn").onclick = () => $("#seamFile").click();
      $("#batchLoadBtn").onclick = () => $("#batchFile").click();
      $("#saveBtn").onclick = saveSeamJson;
      // 顶栏“保存 Garment JSON”：将裁片语义导出为 JSON（与侧栏编辑器的保存共用同一逻辑）
      $("#saveGarmentBtn").onclick = saveGarmentJson;
      // 语义编辑栏右上角关闭：丢弃未保存的临时修改，取消选中，关闭右侧编辑栏
      $("#pseCloseBtn").onclick = () => {
        pendingEdits.clear();
        focusedPanelId = null;
        renderAll();
      };

      // 缝合关系列表点击：删除按钮走删除流程，item 本体查看方向详情。
      // 容器级事件委托，重渲染后依然生效；与 hover 高亮（highlight）互不干扰。
      $("#stitchList").addEventListener("click", (e) => {
        const btn = e.target.closest("[data-delete]");
        if (btn) {
          e.stopPropagation();
          deleteStitch(btn.dataset.delete);
          return;
        }
        const item = e.target.closest("[data-stitch]");
        if (!item) return;
        e.stopPropagation();
        const id = item.dataset.stitch;
        // 单击已选中的 item → 取消选中：移除高亮、清除选中态、收起右侧方向详情栏
        if (id === selectedStitchId) {
          item.classList.remove("active");
          selectedStitchId = null;
          if (rightPanelKey === "sde") setRightPanel(null);
          updateSdDirtyBadge();
          return;
        }
        showStitchDirection(id);
      });

      // 方向详情：点对应（曲线组端点对应）编辑 —— 添加 / 删除 / 切换点对应虚线
      $("#sdBody").addEventListener("click", (e) => {
        // 切换点对应虚线可视开关
        const sw = e.target.closest("#sdPmVisible");
        if (sw) {
          e.stopPropagation();
          togglePointMatchVisible(sw.checked);
          return;
        }
        const add = e.target.closest("[data-sdpm-add]");
        if (add) {
          e.stopPropagation();
          if (selectedStitchId) addPointMatch(selectedStitchId);
          return;
        }
        const del = e.target.closest("[data-sdpm-del]");
        if (del) {
          e.stopPropagation();
          const i = parseInt(del.dataset.sdpmDel, 10);
          if (Number.isFinite(i) && selectedStitchId)
            removePointMatch(selectedStitchId, i);
          return;
        }
      });
      // ============ 自定义下拉：点对应端点选择（悬停选项 → 画布端点放大） ============
      // 原生 <select> 的展开列表由浏览器绘制，无法捕获选项悬停事件，故改为 DOM 列表，
      // 在此统一管理展开/收起、选项选择与悬停时画布端点的联动高亮。
      function clearEndpointHighlight() {
        document
          .querySelectorAll(".sd-ep-hot")
          .forEach((el) => el.classList.remove("sd-ep-hot"));
      }
      // 按引用值（${edge_id}|${endpoint}）高亮画布上对应的端点标记（.sd-ep-hot 触发平滑放大）
      function highlightEndpointForRef(ref) {
        clearEndpointHighlight();
        if (!ref) return;
        document.querySelectorAll("[data-pm-ref]").forEach((el) => {
          if (el.dataset.pmRef === ref) el.classList.add("sd-ep-hot");
        });
      }
      // portal 状态：当前挂载到 body 的菜单元素及其所属触发器根节点
      let csMenuEl = null;
      let csMenuRoot = null;
      function closeCsMenus() {
        document.querySelectorAll(".sd-cs.open").forEach((el) => {
          el.classList.remove("open");
          const trig = el.querySelector("[data-cs-trigger]");
          if (trig) trig.setAttribute("aria-expanded", "false");
        });
        if (csMenuEl && csMenuEl.parentNode)
          csMenuEl.parentNode.removeChild(csMenuEl);
        csMenuEl = null;
        csMenuRoot = null;
        clearEndpointHighlight();
      }

      // 展开下拉：动态构建选项列表并挂载到 body（portal，fixed 定位锚定触发器），
      // 脱离抽屉/卡片 overflow:hidden 的裁剪链；视口下方空间不足时自动向上展开。
      function openCsMenu(root) {
        closeCsMenus();
        if (!root || !selectedStitchId) return;
        const trig = root.querySelector("[data-cs-trigger]");
        const stitch = ((seam && seam.stitches) || []).find(
          (s) => s.stitch_id === selectedStitchId,
        );
        if (!trig || !stitch) return;
        const side = root.dataset.sdpmSide === "b" ? "B" : "A";
        const opts = sdCoreEndpointOptions(stitch, side, sdRegistry);
        const menu = document.createElement("div");
        menu.className = "sd-cs-menu portal";
        menu.setAttribute("role", "listbox");
        let html =
          '<button type="button" class="sd-cs-opt placeholder" data-cs-val="">— 请选择端点 —</button>';
        for (const o of opts) {
          html +=
            '<button type="button" class="sd-cs-opt" data-cs-val="' +
            esc(o.value) +
            '">' +
            esc(o.label) +
            "</button>";
        }
        menu.innerHTML = html;
        const rect = trig.getBoundingClientRect();
        const maxH = 200;
        const spaceBelow = window.innerHeight - rect.bottom - 8;
        const openUp = spaceBelow < maxH && rect.top > spaceBelow;
        menu.style.left = rect.left + "px";
        // 宽度自适应选项文字长度（顶点名称），仅保证不窄于触发器
        menu.style.minWidth = rect.width + "px";
        if (openUp) {
          menu.style.bottom = window.innerHeight - rect.top + 2 + "px";
        } else {
          menu.style.top = rect.bottom + 2 + "px";
        }
        document.body.appendChild(menu);
        root.classList.add("open");
        trig.setAttribute("aria-expanded", "true");
        csMenuEl = menu;
        csMenuRoot = root;
      }

      // 触发器点击：展开/收起（选项点击在 document 层处理，因为菜单已挂载到 body）
      $("#sdBody").addEventListener("click", (e) => {
        const trig = e.target.closest("[data-cs-trigger]");
        if (!trig) return;
        e.stopPropagation();
        const root = trig.closest("[data-cs-root]");
        if (csMenuRoot === root) {
          closeCsMenus();
        } else {
          openCsMenu(root);
        }
      });
      // 选项选择：写入缝合关系并收起；点击下拉以外区域时收起
      document.addEventListener("click", (e) => {
        const opt = e.target.closest("[data-cs-val]");
        if (opt && csMenuRoot) {
          e.stopPropagation();
          const root = csMenuRoot;
          const i = parseInt(root.dataset.sdpmI, 10);
          const side = root.dataset.sdpmSide;
          closeCsMenus();
          if (Number.isFinite(i) && selectedStitchId)
            setPointMatchEndpoint(selectedStitchId, i, side, opt.dataset.csVal);
          return;
        }
        if (!e.target.closest(".sd-cs")) closeCsMenus();
      });
      // 悬停选项 → 画布对应端点放大；移出选项（含离开下拉/门户菜单）时清除高亮
      document.addEventListener("mouseover", (e) => {
        const opt = e.target.closest("[data-cs-val]");
        highlightEndpointForRef(opt ? opt.dataset.csVal : "");
      });
      // 滚动/缩放时收起门户菜单，避免 fixed 定位与触发器错位
      document.addEventListener("scroll", closeCsMenus, true);
      window.addEventListener("resize", closeCsMenus);

      // 方向详情动作栏：保存当前 item 的修改 / 重置当前 item 到最近保存状态。
      // 重置为不可逆操作，故先经二次确认弹窗再回滚。
      $("#sdSaveItemBtn").addEventListener("click", (e) => {
        e.stopPropagation();
        saveSelectedStitchItem();
      });
      $("#sdResetItemBtn").addEventListener("click", (e) => {
        e.stopPropagation();
        const stitchId = selectedStitchId;
        if (!stitchId) return;
        if (!dirtyStitchSet.has(stitchId)) {
          toast("当前 item 无未保存修改");
          updateSdDirtyBadge();
          return;
        }
        openConfirmModal(
          "重置缝合关系",
          `确定要将 ${stitchId} 恢复到最近一次保存的状态吗？\n当前未保存的起点/终点修改将被丢弃。此操作不可撤销。`,
          () => resetSelectedStitchItem(),
          { confirmText: "确认重置", confirmClass: "danger" },
        );
      });

      // 确认弹窗
      $("#modalConfirmBtn").onclick = () => {
        const cb = modalOnConfirm;
        closeModal();
        if (cb) cb();
      };
      $("#modalCancelBtn").onclick = closeModal;
      modalOverlay.addEventListener("click", (e) => {
        if (e.target === modalOverlay) closeModal();
      });
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") {
          if (modalOverlay.classList.contains("show")) {
            closeModal();
          } else if (document.querySelector(".sd-cs.open")) {
            // 先收起展开的端点选择下拉，避免与下方弹窗/人工缝合逻辑抢占
            closeCsMenus();
          } else if (manualMode.active) {
            if (manualMode.selections.length) {
              manualCancel();
            } else {
              manualExit();
            }
          }
        }
      });

      $("#garmentFile").onchange = (e) => {
        if (e.target.files[0]) loadFile(e.target.files[0], "garment");
        e.target.value = "";
      };
      $("#seamFile").onchange = (e) => {
        if (e.target.files[0]) loadFile(e.target.files[0], "seam");
        e.target.value = "";
      };
      $("#batchFile").onchange = (e) => {
        if (e.target.files.length) batchLoad([...e.target.files]);
        e.target.value = "";
      };

      // 拖拽加载 - 阻止浏览器默认行为
      ["dragenter", "dragover", "dragleave", "drop"].forEach((evt) => {
        document.body.addEventListener(evt, (e) => {
          e.preventDefault();
          e.stopPropagation();
        });
      });

      const canvasArea = document.querySelector(".canvas-area");
      canvasArea.addEventListener("dragover", (e) => {
        e.preventDefault();
        e.stopPropagation();
        canvasArea.style.background = "#dbeafe";
      });
      canvasArea.addEventListener("dragleave", (e) => {
        e.preventDefault();
        e.stopPropagation();
        canvasArea.style.background = "";
      });
      canvasArea.addEventListener("drop", (e) => {
        e.preventDefault();
        e.stopPropagation();
        canvasArea.style.background = "";
        const files = [...e.dataTransfer.files].filter((f) =>
          f.name.endsWith(".json"),
        );
        if (files.length === 0) {
          toast("请拖入 JSON 文件");
          return;
        }
        if (files.length === 1) {
          const name = files[0].name;
          if (
            name.includes(".garment.reviewed.json") ||
            name.includes(".garment.")
          ) {
            loadFile(files[0], "garment");
          } else if (
            name.includes(".seam.reviewed.json") ||
            name.includes(".seam.")
          ) {
            loadFile(files[0], "seam");
          } else {
            loadFile(files[0], "garment");
          }
        } else {
          batchLoad(files);
        }
      });

      // 标签/缝合线开关
      $("#showLabels").onchange = (e) => {
        showLabels = e.target.checked;
        $("#labelToggle").classList.toggle("active", showLabels);
        renderCanvas();
      };
      $("#showSeams").onchange = (e) => {
        showSeams = e.target.checked;
        $("#seamToggle").classList.toggle("active", showSeams);
        renderCanvas();
      };
      $("#showEdgeSemantics").onchange = (e) => {
        showEdgeSemantics = e.target.checked;
        $("#edgeSemanticToggle").classList.toggle("active", showEdgeSemantics);
        renderCanvas();
      };
      $("#showNotches").onchange = (e) => {
        showNotches = e.target.checked;
        $("#notchToggle").classList.toggle("active", showNotches);
        renderCanvas();
      };

      // 缩放/平移
      $("#fitBtn").onclick = fitToCanvas;
      $("#zoomInBtn").onclick = () => {
        const cx = svgW / 2,
          cy = svgH / 2;
        const old = transform.k;
        transform.k = Math.min(8, old * 1.2);
        transform.x = cx - ((cx - transform.x) * transform.k) / old;
        transform.y = cy - ((cy - transform.y) * transform.k) / old;
        updateTransform();
      };
      $("#zoomOutBtn").onclick = () => {
        const cx = svgW / 2,
          cy = svgH / 2;
        const old = transform.k;
        transform.k = Math.max(0.05, old / 1.2);
        transform.x = cx - ((cx - transform.x) * transform.k) / old;
        transform.y = cy - ((cy - transform.y) * transform.k) / old;
        updateTransform();
      };

      // SVG 滚轮缩放
      svg.addEventListener(
        "wheel",
        (e) => {
          e.preventDefault();
          const r = svg.getBoundingClientRect();
          const mx = e.clientX - r.left;
          const my = e.clientY - r.top;
          const old = transform.k;
          const next = Math.max(
            0.05,
            Math.min(8, old * (e.deltaY < 0 ? 1.12 : 0.89)),
          );
          transform.x = mx - ((mx - transform.x) * next) / old;
          transform.y = my - ((my - transform.y) * next) / old;
          transform.k = next;
          updateTransform();
        },
        { passive: false },
      );

      // 右键拖拽平移画布（常态与人工缝合模式下均可用；与左键框选/点选互不冲突）
      svg.addEventListener("pointerdown", (e) => {
        if (e.button !== 2) return;
        dragState = {
          x: e.clientX,
          y: e.clientY,
          tx: transform.x,
          ty: transform.y,
        };
        svg.setPointerCapture(e.pointerId);
        svg.classList.add("dragging");
      });
      svg.addEventListener("pointermove", (e) => {
        if (dragState) {
          transform.x = dragState.tx + (e.clientX - dragState.x);
          transform.y = dragState.ty + (e.clientY - dragState.y);
          updateTransform();
        }
      });
      const endDrag = () => {
        dragState = null;
        svg.classList.remove("dragging");
      };
      svg.addEventListener("pointerup", endDrag);
      svg.addEventListener("pointercancel", endDrag);
      // 屏蔽浏览器右键菜单，保证右键平移的拖拽体验干净流畅
      svg.addEventListener("contextmenu", (e) => e.preventDefault());

      // ============ 修改记录（History） ============
      // 本地审计日志：记录裁片语义/名称与缝合关系的新增/删除/保存等操作，按文件持久化到 localStorage
      let historyLog = [];
      const historyState = {
        target: "panel",
        from: "",
        to: "",
        q: "",
        page: 1,
        pageSize: 10,
      };
      function historyStorageKey() {
        return (
          "seamPreview.history." +
          (garmentFileName || garment?.garment_id || "default")
        );
      }
      function loadHistory() {
        try {
          const raw = localStorage.getItem(historyStorageKey());
          historyLog = raw ? JSON.parse(raw) : [];
          if (!Array.isArray(historyLog)) historyLog = [];
        } catch (e) {
          historyLog = [];
        }
      }
      function saveHistory() {
        try {
          localStorage.setItem(historyStorageKey(), JSON.stringify(historyLog));
        } catch (e) {
          /* 容量不足等忽略 */
        }
      }
      function makeHistoryEntry(
        target,
        action,
        subject,
        before,
        after,
        diff,
        summary,
      ) {
        return {
          id: "h_" + Date.now() + "_" + Math.random().toString(36).slice(2, 8),
          ts: Date.now(),
          target,
          action,
          subject,
          before,
          after,
          diff,
          summary,
        };
      }
      function pushHistory(entry) {
        historyLog.push(entry);
        saveHistory();
        // 弹窗开启且目标一致时即时刷新（提升可感知性）
        if ($("#hmOverlay").classList.contains("show")) renderHistory();
        // 同步内嵌于侧边栏下半部分的修改记录
        renderSidebarHistory();
      }
      // 记录裁片语义/名称变化（自动比对 before 与当前状态生成差异）
      function recordPanelChange(panel, before) {
        const after = {
          role: panel.role || "",
          name: String(panel.name || ""),
        };
        const diff = [];
        if (String(before.role || "") !== String(after.role))
          diff.push({
            field: "语义 role",
            from: before.role || "",
            to: after.role,
          });
        if (String(before.name || "") !== String(after.name))
          diff.push({
            field: "裁片名 name",
            from: before.name || "",
            to: after.name,
          });
        if (!diff.length) return;
        pushHistory(
          makeHistoryEntry(
            "panel",
            "修改语义/名称",
            panel.panel_id,
            before,
            after,
            diff,
            `[${panel.panel_id}] ` +
              diff
                .map((d) => `${d.field}: ${d.from || "无"} → ${d.to || "无"}`)
                .join("；"),
          ),
        );
      }
      // 记录缝合关系变化（新增/删除等）
      function recordSeamChange(action, subject, before, after, diff, summary) {
        pushHistory(
          makeHistoryEntry(
            "seam",
            action,
            subject,
            before || {},
            after || {},
            diff || null,
            summary,
          ),
        );
      }
      function formatTs(ts) {
        const d = new Date(ts);
        const p = (n) => String(n).padStart(2, "0");
        return (
          `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ` +
          `${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`
        );
      }
      function historyFiltered() {
        let list = historyLog.filter((e) => e.target === historyState.target);
        // 裁片修改记录仅显示当前选中裁片；缝合关系记录不受此限制
        if (historyState.target === "panel")
          list = list.filter((e) => e.subject === focusedPanelId);
        const from = historyState.from
          ? new Date(historyState.from).getTime()
          : null;
        const to = historyState.to ? new Date(historyState.to).getTime() : null;
        if (from !== null) list = list.filter((e) => e.ts >= from);
        if (to !== null) list = list.filter((e) => e.ts <= to);
        const q = historyState.q.trim().toLowerCase();
        if (q) {
          list = list.filter((e) => {
            const d = (e.diff || [])
              .map((x) => `${x.field} ${x.from} ${x.to}`)
              .join(" ");
            const hay =
              `${e.action} ${e.subject} ${e.summary || ""} ${d}`.toLowerCase();
            return hay.includes(q);
          });
        }
        list.sort((a, b) => b.ts - a.ts);
        return list;
      }
      function historyItemHtml(it) {
        const diffHtml =
          it.diff && it.diff.length
            ? `<div class="hm-diff">` +
              it.diff
                .map(
                  (d) => `
        <div class="hm-diff-row">
          <span class="hm-diff-field">${esc(d.field)}：</span>
          <span class="hm-diff-old">${esc(d.from || "—")}</span>
          <span class="hm-arrow">→</span>
          <span class="hm-diff-new">${esc(d.to || "—")}</span>
        </div>`,
                )
                .join("") +
              `</div>`
            : "";
        const subj = it.subject
          ? `<span class="hm-name">${esc(it.subject)}</span>`
          : "";
        const rollable = it.target === "panel";
        return `
      <div class="hm-item hm-${it.target}${rollable ? " hm-rollable" : ""}" data-heid="${esc(it.id)}"${rollable ? ' title="点击回退到该记录的修改状态"' : ""}>
        <div class="hm-item-top">
          <span class="hm-time">${esc(formatTs(it.ts))}</span>
          <span class="hm-action">${esc(it.action)}</span>
          ${subj}
        </div>
        ${diffHtml}
        ${it.summary ? `<div class="hm-summary">${esc(it.summary)}</div>` : ""}
        ${rollable ? '<span class="hm-roll-hint">点击回退 ↺</span>' : ""}
      </div>`;
      }
      // 仅渲染当前页，避免一次性渲染全部条目导致卡顿
      function renderHistory() {
        const list = historyFiltered();
        const total = list.length;
        const size = historyState.pageSize;
        const nPages = Math.max(1, Math.ceil(total / size));
        historyState.page = Math.max(1, Math.min(historyState.page, nPages));
        const start = (historyState.page - 1) * size;
        const pageItems = list.slice(start, start + size);
        $("#hmCount").textContent = `共 ${total} 条记录`;
        if (!total) {
          $("#hmList").innerHTML = '<div class="hm-empty">暂无修改记录</div>';
          $("#hmPage").textContent = "0 / 0";
          $("#hmPrev").disabled = true;
          $("#hmNext").disabled = true;
          return;
        }
        $("#hmPage").textContent = `${historyState.page} / ${nPages}`;
        $("#hmPrev").disabled = historyState.page <= 1;
        $("#hmNext").disabled = historyState.page >= nPages;
        $("#hmList").innerHTML = pageItems.map(historyItemHtml).join("");
      }
      // 内嵌于裁片语义侧边栏下半部分的修改记录：仅展示当前选中裁片（语义）修改，倒序最新在上
      function renderSidebarHistory() {
        const listEl = document.getElementById("pseHistoryList");
        if (!listEl) return;
        const countEl = document.getElementById("boardSemHistoryCount");
        const list =
          focusedPanelId !== null
            ? historyLog
                .filter(
                  (e) => e.target === "panel" && e.subject === focusedPanelId,
                )
                .sort((a, b) => b.ts - a.ts)
            : [];
        if (countEl) countEl.textContent = list.length;
        listEl.innerHTML = list.length
          ? list.map(historyItemHtml).join("")
          : '<div class="hm-empty">暂无修改记录</div>';
      }
      function setHistoryTab(target) {
        historyState.target = target;
        historyState.page = 1;
        $("#hmTabPanel").classList.toggle("active", target === "panel");
        $("#hmTabSeam").classList.toggle("active", target === "seam");
        renderHistory();
      }

      // ============ 修改记录回退 ============
      // 将裁片语义恢复到指定历史记录所对应的 after 状态（role/name 及草稿、界面显示），
      // 并追加一条“回退”历史。仅追加不删除，保持列表完整性与时间顺序，
      // 不重置撤销/草稿状态，故不影响后续新修改记录的生成。
      function rollbackPanelTo(entry) {
        const panel =
          garment && garment.panels.find((p) => p.panel_id === entry.subject);
        if (!panel) {
          toast("找不到对应裁片，无法回退");
          return;
        }
        const target = entry.after || {};
        const before = {
          role: panel.role || "",
          name: String(panel.name || ""),
        };
        panel.role = target.role || "";
        panel.name = String(target.name || "");
        // 同步草稿与“未保存”徽标
        const orole = panelOriginalRoleMap.has(panel.panel_id)
          ? panelOriginalRoleMap.get(panel.panel_id)
          : panel.role;
        if (panel.role !== orole) draftRoles.set(panel.panel_id, panel.role);
        else draftRoles.delete(panel.panel_id);
        const oname = panelOriginalNameMap.has(panel.panel_id)
          ? panelOriginalNameMap.get(panel.panel_id)
          : String(panel.name);
        if (String(panel.name) !== String(oname))
          draftNames.set(panel.panel_id, panel.name);
        else draftNames.delete(panel.panel_id);
        persistDraft();
        pendingEdits.delete(panel.panel_id); // 丢弃该裁片未保存的临时修改
        // 追加“回退”修改记录，保持列表完整与时间顺序
        const after = {
          role: panel.role || "",
          name: String(panel.name || ""),
        };
        const diff = [];
        if (String(before.role || "") !== String(after.role))
          diff.push({
            field: "语义 role",
            from: before.role || "",
            to: after.role,
          });
        if (String(before.name || "") !== String(after.name))
          diff.push({
            field: "裁片名 name",
            from: before.name || "",
            to: after.name,
          });
        if (diff.length)
          pushHistory(
            makeHistoryEntry(
              "panel",
              "回退",
              panel.panel_id,
              before,
              after,
              diff,
              `[${panel.panel_id}] 回退：` +
                diff
                  .map((d) => `${d.field}: ${d.from || "无"} → ${d.to || "无"}`)
                  .join("；"),
            ),
          );
        // 聚焦该裁片并整体刷新（列表、画布、编辑栏、修改记录）
        focusedPanelId = panel.panel_id;
        if (manualMode && manualMode.active) manualExit();
        renderAll();
        renderSidebarHistory();
        toast(`已回退裁片 ${panel.panel_id} 到该记录的状态`);
      }
      // 点击历史记录条目：仅裁片（panel）记录可回退，先弹确认对话框
      function handleHistoryItemClick(e) {
        const item = e.target.closest("[data-heid]");
        if (!item) return;
        const entry = historyLog.find((x) => x.id === item.dataset.heid);
        if (!entry) return;
        if (entry.target !== "panel") {
          toast("仅裁片语义修改记录可回退");
          return;
        }
        const panel =
          garment && garment.panels.find((p) => p.panel_id === entry.subject);
        if (!panel) {
          toast("找不到对应裁片，无法回退");
          return;
        }
        const targetAfter = entry.after || {};
        const targetName = String(targetAfter.name || "").trim();
        const label =
          targetName || panelSemanticName(targetAfter.role) || entry.subject;
        openConfirmModal(
          "回退修改记录",
          `确定将裁片 ${entry.subject} 回退到该记录的状态？\n` +
            `当前：${String(panel.name || "").trim() || panel.panel_id}（${panel.role || "无"}）\n` +
            `回退后：${label}（${targetAfter.role || "无"}）\n\n` +
            `确认后裁片语义将恢复为该记录时的 role / 名称，并追加一条回退记录。`,
          () => rollbackPanelTo(entry),
          { confirmText: "确认回退", confirmClass: "primary" },
        );
      }
      // 弹窗列表与侧边栏内嵌列表均可点击回退
      $("#hmList").addEventListener("click", handleHistoryItemClick);
      document
        .getElementById("pseHistoryList")
        .addEventListener("click", handleHistoryItemClick);
      function openHistory() {
        loadHistory(); // 每次打开重新读取，避免遗漏其他标签页的更新
        $("#hmFrom").value = historyState.from;
        $("#hmTo").value = historyState.to;
        $("#hmSearch").value = historyState.q;
        historyState.page = 1;
        $("#hmOverlay").classList.add("show");
        renderHistory();
      }
      function closeHistory() {
        $("#hmOverlay").classList.remove("show");
      }
      $("#historyBtn").onclick = openHistory;
      // 侧边栏下半部分「查看完整修改记录」：打开完整弹窗（含筛选/搜索/分页）
      $("#boardHistoryBtn").onclick = openHistory;
      $("#hmCloseBtn").onclick = closeHistory;
      $("#hmOverlay").addEventListener("click", (e) => {
        if (e.target === e.currentTarget) closeHistory();
      });
      ["hmTabPanel", "hmTabSeam"].forEach((id) => {
        $("#" + id).addEventListener("click", () =>
          setHistoryTab($("#" + id).dataset.target),
        );
      });
      // 关键词搜索：节流 200ms，避免频繁重渲染
      let hmDebounce;
      $("#hmSearch").addEventListener("input", () => {
        clearTimeout(hmDebounce);
        hmDebounce = setTimeout(() => {
          historyState.q = $("#hmSearch").value;
          historyState.page = 1;
          renderHistory();
        }, 200);
      });
      $("#hmFrom").addEventListener("change", () => {
        historyState.from = $("#hmFrom").value;
        historyState.page = 1;
        renderHistory();
      });
      $("#hmTo").addEventListener("change", () => {
        historyState.to = $("#hmTo").value;
        historyState.page = 1;
        renderHistory();
      });
      $("#hmPrev").addEventListener("click", () => {
        if (historyState.page > 1) {
          historyState.page--;
          renderHistory();
        }
      });
      $("#hmNext").addEventListener("click", () => {
        if (
          historyState.page <
          Math.ceil(historyFiltered().length / historyState.pageSize)
        ) {
          historyState.page++;
          renderHistory();
        }
      });
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape" && $("#hmOverlay").classList.contains("show"))
          closeHistory();
      });

      // 响应窗口大小变化
      window.addEventListener("resize", () => {
        updateCanvasSize();
        renderCanvas();
      });

      // ============ 关闭/刷新时清理浏览器会话缓存 ============
      // 清除与当前编辑会话相关的内存状态与 localStorage（草稿 + 修改记录 + 用户），
      // 保证重新打开同一 JSON 时读到的是文件原始信息，不受上次编辑缓存影响。
      // 注意：刷新与关闭标签页都会触发 pagehide / unload，故两者都会触发清理。
      function clearSessionCache() {
        pendingEdits.clear();
        draftRoles.clear();
        draftNames.clear();
        semEditHistory.length = 0;
        panelOriginalRoleMap.clear();
        panelOriginalNameMap.clear();
        try {
          localStorage.removeItem(semDraftKey());
        } catch (e) {}
        try {
          localStorage.removeItem(historyStorageKey());
        } catch (e) {}
      }
      window.addEventListener("pagehide", clearSessionCache);
      window.addEventListener("unload", clearSessionCache);

      // 初始渲染（延迟一帧确保布局完成）
      requestAnimationFrame(() => {
        updateCanvasSize();
        renderAll();
        fitToCanvas();
      });
    </script>
  </body>
</html>
