          }
        }

        // 选中缝合关系：在大边起点（绿点）与终点（红点）绘制方向标识
        for (const g of sdSelGroups) {
          // data-pm-ref 与点对应下拉选项的引用值一致（组起点=首条成员边起点、组终点=末条成员边终点），
          // 便于悬停下拉选项时高亮画布上对应端点
          const startMembers =
            g.group_ids && g.group_ids[0]
              ? sdCoreResolveGroupMembers(g.group_ids[0])
              : g.member_edge_ids || [];
          const endMembers =
            g.group_ids && g.group_ids.length
              ? sdCoreResolveGroupMembers(g.group_ids[g.group_ids.length - 1])
              : g.member_edge_ids || [];
          const startRef = startMembers[0]
            ? sdCoreRefValue({ edge_id: startMembers[0], endpoint: "start" })
            : "";
          const endRef = endMembers.length
            ? sdCoreRefValue({
                edge_id: endMembers[endMembers.length - 1],
                endpoint: "end",
              })
            : "";
          const marker = (pt, cls, r, ref) => {
            if (!pt || !Array.isArray(pt.point) || pt.point.length < 2) return;
            const [mx, my] = toSvg(pt.point);
            const c = document.createElementNS(ns, "circle");
            c.setAttribute("cx", mx);
            c.setAttribute("cy", my);
            c.setAttribute("r", r);
            c.setAttribute("class", cls);
            if (ref) c.setAttribute("data-pm-ref", ref);
            c.setAttribute(
              "title",
              (pt.name || "") + " (" + (pt.id || "") + ")",
            );
            viewport.appendChild(c);
          };
          marker(g.start, "sd-mark-start", 4, startRef);
          marker(g.end, "sd-mark-end", 4, endRef);
        }

        // 点对应虚线：选中缝合关系时，默认按 point_matches 在两两端点间绘制紫色虚线，
        // 可在“缝合关系方向”侧栏的点对应可视开关控制显隐。
        if (selectedStitchId && pointMatchVisible && selStitch) {
          const pm = Array.isArray(selStitch.point_matches)
            ? selStitch.point_matches
            : [];
          for (const m of pm) {
            if (!m || !m.a || !m.b) continue;
            const av = sdCoreEndpointVertex(m.a.edge_id, m.a.endpoint, sdRegistry);
            const bv = sdCoreEndpointVertex(m.b.edge_id, m.b.endpoint, sdRegistry);
            if (!av || !bv) continue;
            const [ax, ay] = toSvg(av.point);
            const [bx, by] = toSvg(bv.point);
            const line = document.createElementNS(ns, "line");
            line.setAttribute("x1", ax);
            line.setAttribute("y1", ay);
            line.setAttribute("x2", bx);
            line.setAttribute("y2", by);
            line.setAttribute("class", "point-match-line");
            viewport.appendChild(line);
            // 两个圆点分别对应 A/B 侧端点引用，标记 data-pm-ref 以支持下拉悬停高亮
            const dotRefs = [sdCoreRefValue(m.a), sdCoreRefValue(m.b)];
            for (let di = 0; di < 2; di++) {
              const [px, py] = di === 0 ? [ax, ay] : [bx, by];
              const dot = document.createElementNS(ns, "circle");
              dot.setAttribute("cx", px);
              dot.setAttribute("cy", py);
              dot.setAttribute("r", 3);
              dot.setAttribute("class", "point-match-dot");
              if (dotRefs[di]) dot.setAttribute("data-pm-ref", dotRefs[di]);
              viewport.appendChild(dot);
            }
          }
        }

        // 人工缝合选中态高亮
        renderManualSelection();
      }

      // 解析端点引用（edge_id + endpoint）到可展示的端点顶点对象
      function sdCoreEndpointVertex(edgeId, endpoint, reg) {
        if (!edgeId) return null;
        const info = sdCoreEdgeInfo(garment, edgeId, reg || sdRegistry);
        if (!info) return null;
        return endpoint === "end" ? info.end : info.start;
      }

      // 绘制人工缝合的选中边链（多条，各自着色）与端点标记
      function renderManualSelection() {
        const ns = "http://www.w3.org/2000/svg";
        manualMode.selections.forEach((sel, idx) => {
          const color = chainColor(idx);
          for (const eid of sel.edgeIds) {
            const entry = edgeLookup[eid];
            if (!entry) continue;
            const pts = entry.edge.sampled_points || [
              entry.edge.start_point,
              entry.edge.end_point,
            ];
            const path = document.createElementNS(ns, "path");
            path.setAttribute("d", pathD(pts));
            path.setAttribute("class", "edge-line manual-sel");
            path.setAttribute("stroke", color);
            path.dataset.edgeId = eid;
            viewport.appendChild(path);
          }
          // 端点标记（两端各一，使用组边颜色）；尺寸随缩放自适应，保持恒定屏幕像素
          for (const p of [sel.startPoint, sel.endPoint]) {
            const [cx, cy] = toSvg(p);
            const isSel = idx === manualMode.selectedIdx;
            const dot = document.createElementNS(ns, "circle");
            dot.setAttribute("cx", cx);
            dot.setAttribute("cy", cy);
            dot.setAttribute("data-sel", isSel ? "1" : "0");
            const rIso = (isSel ? EP_SEL_PX : EP_PX) / transform.k;
            dot.setAttribute("r", rIso.toFixed(3));
            // 白色外圈描边随内圈半径按比例同步缩放，保持两者相对视觉关系
            dot.style.strokeWidth = (rIso * EP_STROKE_RATIO).toFixed(3) + "px";
            dot.setAttribute("class", "manual-endpoint-sel");
            dot.setAttribute("fill", color);
            viewport.appendChild(dot);
          }
        });
      }

      // ============ 交互 ============
      function focusPanel(panelId) {
        // 切换/取消聚焦裁片即视为“进行其它操作而未保存”，丢弃当前临时（pending）修改
        pendingEdits.clear();
        // 切换到裁片语义编辑栏时清除缝合关系方向详情的选择态
        if (selectedStitchId) {
          selectedStitchId = null;
          document.querySelectorAll("[data-stitch]").forEach((el) => {
            el.classList.remove("active");
          });
        }
        if (focusedPanelId === panelId) {
          focusedPanelId = null;
        } else {
          // 打开裁片语义编辑栏时自动退出人工缝合模式，保证两功能互斥
          if (manualMode && manualMode.active) manualExit();
          focusedPanelId = panelId;
        }
        renderAll();
        // 滚动面板列表
        const item = document.querySelector(
          `[data-panel="${CSS.escape(panelId)}"]`,
        );
        if (item) item.scrollIntoView({ block: "nearest" });
      }

      function highlightStitch(stitchId) {
        hoveredStitchId = stitchId;
        // 仅重绘画布强调该缝合线，并就地切换列表高亮，
        // 避免重建列表 DOM（不重建即可防止 list-item 闪烁，也不会替换
        // 悬浮/点击目标的节点，保证删除按钮点击与弹窗正常触发）
        renderCanvas();
        document.querySelectorAll("[data-stitch]").forEach((el) => {
          el.classList.toggle("highlight", el.dataset.stitch === stitchId);
        });
      }

      function clearStitchHighlight() {
        hoveredStitchId = null;
        renderCanvas();
        document.querySelectorAll("[data-stitch]").forEach((el) => {
          el.classList.remove("highlight");
        });
      }

      // ============ 列表渲染 ============
      function renderPanelList() {
        if (!garment || !garment.panels) {
          $("#panelList").innerHTML =
            '<div class="empty-state">请加载 Garment JSON</div>';
          $("#panelCount").textContent = "0";
          return;
        }
        $("#panelCount").textContent = garment.panels.length;
        $("#panelList").innerHTML = garment.panels
          .map((p) => {
            const role = p.role || "unknown";
            const semName = panelSemanticName(p.role); // 语义库中文名
            const displayName = panelDisplayName(p); // 自定义名 > 语义名 > panel_id
            const hasCustom = hasCustomPanelName(p);
            const area = p.area ? Number(p.area).toFixed(0) : "?";
            const vis = !hiddenPanels.has(p.panel_id);
            return `<div class="list-item${focusedPanelId === p.panel_id ? " active" : ""}" data-panel="${esc(p.panel_id)}">
      <span class="swatch ${esc(p.review_status || "pending_review")}"></span>
      <span class="item-info">
        <span class="item-title">${esc(p.panel_id)}${hasCustom ? `<em class="item-sem">✎ ${esc(displayName)}</em>` : semName ? `<em class="item-sem">${esc(semName)}</em>` : ""}</span>
        <span class="item-sub">${esc(role)} · ${area} mm²</span>
      </span>
      <span class="item-meta">${p.edges?.length || 0} 边</span>
      <label class="vis-switch" title="${vis ? "隐藏裁片" : "显示裁片"}">
        <input type="checkbox" class="vis-chk" data-vis-panel="${esc(p.panel_id)}" ${vis ? "checked" : ""} />
        <span class="vis-slider"></span>
      </label>
    </div>`;
          })
          .join("");

        document.querySelectorAll("[data-panel]").forEach((el) => {
          el.onclick = (e) => {
            if (e.target.closest(".vis-switch")) return; // 开关点击不聚焦
            focusPanel(el.dataset.panel);
          };
        });
        // 裁片可视性开关：单独控制该裁片显示/隐藏，不影响其他裁片。
        // 使用 change 事件，让浏览器原生切换复选框状态，保证视觉与状态始终同步
        document.querySelectorAll(".vis-chk").forEach((chk) => {
          chk.addEventListener("click", (e) => e.stopPropagation());
          chk.addEventListener("change", (e) => {
            e.stopPropagation();
            const pid = chk.dataset.visPanel;
            if (chk.checked) {
              hiddenPanels.delete(pid);
            } else {
              hiddenPanels.add(pid);
            }
            renderCanvas();
          });
        });
      }

      // ============ 右侧功能栏（按需显示，同一时间仅显示一个模块） ============
      const drawer = $("#rightDrawer");
      const drawerSections = {
        msp: $("#mspSection"),
        pse: $("#pseSection"),
        sde: $("#sdSection"),
      };
      // 当前屏幕右侧展示的功能模块：null | 'msp' | 'pse' | 'sde'
      let rightPanelKey = null;
      // 显示指定功能编辑栏；key 传 null 则整体隐藏侧栏（回收其占用的空间）
      function setRightPanel(key) {
        // 切换/收起右侧功能栏时先收起可能挂载在 body 的点对应下拉（portal 菜单）
        if (typeof closeCsMenus === "function") closeCsMenus();
        key = key || null;
        if (key !== "msp" && key !== "pse" && key !== "sde") key = null;
        rightPanelKey = key;
        for (const k in drawerSections) {
          drawerSections[k].classList.toggle("active", k === key);
        }
        drawer.classList.toggle("open", key !== null);
      }

      // ============ 裁片语义编辑 ============
      // 点击裁片列表的 item 时，在右侧抽屉展示选中裁片的当前语义；
      // 提供下拉框编辑 role，改动即实时预览，保存则输出 Garment JSON 持久化。
      const panelSemEditor = $("#panelSemEditor");
      function renderPanelSemEditor() {
        if (!garment || !garment.panels || !focusedPanelId) {
          // 无选中裁片：仅当当前展示的就是“裁片语义”时才隐藏侧栏，避免误关其它模块
          if (rightPanelKey === "pse") setRightPanel(null);
          return;
        }
        const panel = garment.panels.find((p) => p.panel_id === focusedPanelId);
        if (!panel) {
          if (rightPanelKey === "pse") setRightPanel(null);
          return;
        }
        setRightPanel("pse");
        updateDirtyBadge(); // 同步头部“未保存”徽标
        // 有效语义：优先取未提交（pending）的临时值，否则回落到裁片当前已保存值。
        // 语义类别与自定义语义在 role/name 维度互斥：选类别即清空自定义，输自定义即清空类别下拉。
        const pending = pendingEdits.get(panel.panel_id) || {};
        const effRole =
          (pending.role !== undefined ? pending.role : panel.role) || "";
        const effName =
          pending.name !== undefined ? pending.name : String(panel.name || "");
        const role = effRole || "unknown_panel"; // 语义类别逻辑仍用 role 逻辑名
        const curName = panelSemanticName(effRole);
        // 二级关联下拉：确定当前 role 所属一级大类；非标准 role 归入“自定义类”
        const activeCat = panelSemanticCategoryOf(effRole);
        const isNonStd = !activeCat;
        const selCatKey = activeCat ? activeCat.key : "__other__";
        const catOptions =
          PANEL_SEMANTIC_CATEGORIES.map(
            (c) =>
              `<option value="${c.key}"${
                c.key === selCatKey ? " selected" : ""
              }>${esc(c.name)}</option>`,
          ).join("") +
          `<option value="__other__"${
            selCatKey === "__other__" ? " selected" : ""
          }>自定义类</option>`;
        // 二级下拉：列出所选一级大类下的所有子类别；非标准 role 仅保留当前项，避免数据丢失
        const items4Cat = (key) => {
          if (key === "__other__") {
            // 非标准 role（含自定义语义）归入“自定义类”：中文语义取用户输入的自定义文本，缺失时回退到语义库名/role
            const cn = String(effName || "").trim() || curName || effRole;
            return isNonStd ? [{ role: effRole, name: cn }] : [];
          }
          const c = PANEL_SEMANTIC_CATEGORIES.find((x) => x.key === key);
          return c ? c.items : [];
        };
        // 当前 role 正属于某子类别则预选；否则二级停留在占位“请选择子类别…”
        const subOptions =
          `<option value="">请选择子类别…</option>` +
          items4Cat(selCatKey)
            .map(
              (i) =>
                `<option value="${esc(i.role)}"${
                  i.role === effRole ? " selected" : ""
                }>${esc(i.name)}（${esc(i.role)}）</option>`,
            )
            .join("");
        const customMode = String(effName || "").trim() !== "";
        panelSemEditor.innerHTML = `
          <div class="pse-current">
            <div class="item-title" title="${esc(panel.panel_id)}">${esc(panelDisplayName(panel))}</div>
            <div class="pse-role">当前 role：${esc(effRole || "unknown_panel")}</div>
            ${curName ? `<div class="pse-preview">语义：<span class="item-sem">${esc(curName)}</span></div>` : ""}
          </div>
          <div class="pse-field">
            <label>语义类别</label>
            <div class="pse-cats">
              <select class="pse-select" id="panelSemCatSelect"${customMode ? " disabled" : ""}>${catOptions}</select>
              <select class="pse-select" id="panelSemSubSelect"${customMode ? " disabled" : ""}>${subOptions}</select>
            </div>
            <div class="pse-name-error" id="catSemError"></div>
          </div>
          <div class="pse-field">
            <div class="pse-label-row">
              <span class="pse-title">自定义语义</span>
              <label class="vis-switch" title="启用自定义语义将关闭语义类别选择（默认关闭）；需同时填写中文语义与 semantic_id">
                <input type="checkbox" id="customModeToggle" class="vis-chk"${customMode ? " checked" : ""} />
                <span class="vis-slider"></span>
              </label>
            </div>
            <input class="pse-name-input" id="customCnInput" type="text" placeholder="中文语义，如：前下摆" value=""${customMode ? "" : " disabled"} />
            <input class="pse-name-input" id="customSidInput" type="text" placeholder="semantic_id，如：front_hem" value="" style="margin-top:6px"${customMode ? "" : " disabled"} />
            <div class="pse-name-error" id="customSemError"></div>
            <div class="pse-sem-hint" id="pseModeHint">${customMode ? "自定义语义模式下，请同时填写中文语义与 semantic_id 后再临时保存。" : "语义类别模式下，请选择语义类别并完成最末级子类别选择后再临时保存。"}</div>
          </div>
          <div class="pse-actions">
            <button type="button" class="btn" id="pseUndoBtn" title="撤销：逐步回退最近一次已保存的裁片语义修改（循环操作历史）">撤销</button>
            <button type="button" class="btn" id="pseResetBtn" title="重置：清除所有编辑操作，将全部裁片语义恢复为初始加载状态（不可撤销）">重置</button>
          </div>
          <div class="pse-actions">
            <button type="button" class="btn primary" id="pseTempBtn" title="将未保存的语义/自定义修改临时保存（本地草稿）">临时保存</button>
          </div>`;
        const catSel = $("#panelSemCatSelect");
        const subSel = $("#panelSemSubSelect");
        const customCn = $("#customCnInput");
        const customSid = $("#customSidInput");
        const customSemError = $("#customSemError");
        const catSemError = $("#catSemError");
        const modeToggle = $("#customModeToggle");
        const pseModeHint = $("#pseModeHint");
        const pseTempBtn = $("#pseTempBtn");
        // 把已提交的 role/name 草稿同步到 localStorage 并刷新“未保存”徽标
        const refreshDirty = () => {
          if (!(draftRoles.size || draftNames.size)) clearDraft();
          else persistDraft();
          updateDirtyBadge();
        };
        // 清除全部报红与错误提示。界面默认不做实时报红，仅在点击“临时保存”时按校验结果显示。
        const clearFieldError = () => {
          customCn.classList.remove("invalid");
          customSid.classList.remove("invalid");
          catSel.classList.remove("invalid");
          subSel.classList.remove("invalid");
          customSemError.textContent = "";
          catSemError.textContent = "";
        };
        // 一级大类切换：仅重载二级子类别，不改写临时状态
        catSel.onchange = () => {
          const key = catSel.value;
          const items = items4Cat(key);
          subSel.innerHTML =
            `<option value="">请选择子类别…</option>` +
            items
              .map(
                (i) =>
                  `<option value="${esc(i.role)}">${esc(i.name)}（${esc(i.role)}）</option>`,
              )
              .join("");
          // 二级下拉若无可用子类别选项则禁用，避免选择空值
          subSel.disabled = items.length === 0;
          clearFieldError();
        };
        // 二级子类别选择：仅写入临时 pending，未点「临时保存」不写入 panel / 草稿 / 修改记录。
        // 选类别即清空自定义语义（name 置空），保证与自定义互斥。
        subSel.onchange = () => {
          const v = subSel.value;
          if (!v) return;
          pendingEdits.set(panel.panel_id, { role: v, name: "" });
          renderPanelSemEditor(); // 重绘编辑栏（同步“当前 role / 语义”摘要、禁用态与校验状态）
          updateUnsavedBadge();
        };
        // 自定义语义：中文语义输入（写入临时 name，不影响已有 role）
        customCn.addEventListener("input", () => {
          const prev = pendingEdits.get(panel.panel_id) || {};
          pendingEdits.set(panel.panel_id, {
            role: prev.role !== undefined ? prev.role : panel.role || "",
            name: customCn.value,
          });
          clearFieldError();
          updateUnsavedBadge();
        });
        // 自定义语义：semantic_id 输入（写入临时 role）；输入非标准值即清空类别下拉
        customSid.addEventListener("input", () => {
          const prev = pendingEdits.get(panel.panel_id) || {};
          const v = customSid.value.trim();
          pendingEdits.set(panel.panel_id, {
            role: v,
            name:
              prev.name !== undefined ? prev.name : String(panel.name || ""),
          });
          // 输自定义即清类别：若当前值不在二级选项中则回落到占位“请选择子类别…”
          if (v && ![...subSel.options].some((o) => o.value === v))
            subSel.value = "";
          clearFieldError();
          updateUnsavedBadge();
        });
        // 自定义语义模式开关：每次切换都同时重置“语义类别”与“自定义语义内容”为初始（已保存）状态
        modeToggle.addEventListener("change", () => {
          const on = modeToggle.checked;
          catSel.disabled = on;
          customCn.disabled = !on;
          customSid.disabled = !on;
          // 丢弃全部未保存编辑，恢复 panel 已保存的初始语义
          pendingEdits.delete(panel.panel_id);
          customCn.value = "";
          customSid.value = "";
          const curRole = panel.role || "";
          const cat = panelSemanticCategoryOf(curRole);
          const ck = curRole && cat ? cat.key : "__other__";
          if ([...catSel.options].some((o) => o.value === ck))
            catSel.value = ck;
          else catSel.value = "__other__";
          const items = items4Cat(catSel.value);
          subSel.innerHTML =
            `<option value="">请选择子类别…</option>` +
            items
              .map(
                (i) =>
                  `<option value="${esc(i.role)}"${i.role === curRole ? " selected" : ""}>${esc(i.name)}（${esc(i.role)}）</option>`,
              )
              .join("");
          subSel.disabled = on || items.length === 0;
          pseModeHint.textContent = on
            ? "自定义语义模式下，请同时填写中文语义与 semantic_id 后再临时保存。"
            : "语义类别模式下，请选择语义类别并完成最末级子类别选择后再临时保存。";
          clearFieldError();
          updateUnsavedBadge();
        });
        // “临时保存”按钮始终可点；按下时才按当前模式校验（见 pseTempBtn 处理器）
        // 撤销：从撤销栈中逐步回退最近一次针对当前裁片的修改，恢复其旧的 role 与自定义名
        $("#pseUndoBtn").onclick = () => {
          if (pendingEdits.has(panel.panel_id)) {
            pendingEdits.delete(panel.panel_id);
            renderPanelSemEditor();
            updateUnsavedBadge();
            toast("未保存修改已撤销，编辑栏回到已保存状态");
            return;
          }
          let i = semEditHistory.length - 1;
          while (i >= 0 && semEditHistory[i].panelId !== panel.panel_id) i--;
          if (i < 0) {
            toast("当前裁片没有可撤销的修改");
            return;
          }
          const e = semEditHistory.splice(i, 1)[0];
          // 记录撤销前状态，用于写“撤销”修改记录
          const hBefore = {
            role: panel.role || "",
            name: String(panel.name || ""),
          };
          // 恢复 role
          panel.role = e.roleBefore || "";
          const orole = panelOriginalRoleMap.get(panel.panel_id);
          if (panel.role !== orole) draftRoles.set(panel.panel_id, panel.role);
          else draftRoles.delete(panel.panel_id);
          // 恢复自定义名
          panel.name = e.nameBefore || "";
          const oname = panelOriginalNameMap.get(panel.panel_id);
          if (String(panel.name) !== String(oname))
            draftNames.set(panel.panel_id, panel.name);
          else draftNames.delete(panel.panel_id);
          refreshDirty();
          // 写撤销修改记录（对比撤销前后的差异）
          {
            const after = {
              role: panel.role || "",
              name: String(panel.name || ""),
            };
            const diff = [];
            if (String(hBefore.role || "") !== String(after.role))
              diff.push({
                field: "语义 role",
                from: hBefore.role || "",
                to: after.role,
              });
            if (String(hBefore.name || "") !== String(after.name))
              diff.push({
                field: "裁片名 name",
                from: hBefore.name || "",
                to: after.name,
              });
            if (diff.length)
              pushHistory(
                makeHistoryEntry(
                  "panel",
                  "撤销修改",
                  panel.panel_id,
                  hBefore,
                  after,
                  diff,
                  `[${panel.panel_id}] 撤销：` +
                    diff
                      .map(
                        (d) =>
                          `${d.field}: ${d.from || "无"} → ${d.to || "无"}`,
                      )
                      .join("；"),
                ),
              );
          }
          renderPanelSemEditor(); // 重新渲染编辑栏，反映回退后的 role / 自定义名
          renderPanelList();
          renderCanvas();
          const label =
            e.nameBefore || panelSemanticName(panel.role) || panel.panel_id;
          toast(`已撤销，当前裁片名：${label}`);
        };
        // 重置：仅对当前选中裁片生效，恢复其初始语义，不影响其他裁片
        $("#pseResetBtn").onclick = () => {
          if (!garment) return;
          const pid = focusedPanelId;
          const p = pid && garment.panels.find((x) => x.panel_id === pid);
          if (!pid || !p) {
            toast("请先选择要重置的裁片");
            return;
          }
          const orole = panelOriginalRoleMap.has(pid)
            ? panelOriginalRoleMap.get(pid)
            : "";
          const oname = panelOriginalNameMap.has(pid)
            ? String(panelOriginalNameMap.get(pid))
            : "";
          const hasChange =
            String(p.role || "") !== String(orole) ||
            String(p.name || "") !== String(oname) ||
            pendingEdits.has(pid) ||
            draftRoles.has(pid) ||
            draftNames.has(pid) ||
            semEditHistory.some((h) => h.panelId === pid);
          if (!hasChange) {
            toast("该裁片没有需要重置的编辑");
            return;
          }
          openConfirmModal(
            "重置语义编辑",
            `确定要重置裁片 ${pid} 吗？\n这会清除该裁片的编辑操作与未保存修改，并将其语义恢复为初始加载状态。\n不会影响其他裁片。此操作不可撤销，是否继续？`,
            () => {
              if (!p) return;
              const roleFrom = p.role || "";
              const nameFrom = String(p.name || "");
              const roleChanged = roleFrom !== orole;
              const nameChanged = nameFrom !== oname;
              p.role = orole;
              p.name = oname;
              // 仅清除当前裁片的草稿与未保存临时修改，其余裁片草稿保留
              draftRoles.delete(pid);
              draftNames.delete(pid);
              pendingEdits.delete(pid);
              // 从撤销栈移除该裁片的条目
              semEditHistory = semEditHistory.filter((h) => h.panelId !== pid);
              persistDraft(); // 按剩余草稿重写 localStorage，不清空其他裁片
              // 写当前裁片的“重置”修改记录
              if (roleChanged || nameChanged) {
                const before = { role: roleFrom, name: nameFrom };
                const after = { role: orole, name: oname };
                const diff = [];
                if (String(roleFrom) !== String(orole))
                  diff.push({ field: "语义 role", from: roleFrom, to: orole });
                if (nameFrom !== oname)
                  diff.push({
                    field: "裁片名 name",
                    from: nameFrom,
                    to: oname,
                  });
                pushHistory(
                  makeHistoryEntry(
                    "panel",
                    "重置",
                    pid,
                    before,
                    after,
                    diff,
                    `[${pid}] 重置回初始语义`,
                  ),
                );
              }
              renderAll();
              renderSidebarHistory();
              updateDirtyBadge();
              updateUnsavedBadge();
              toast(
                roleChanged || nameChanged
                  ? `已重置裁片 ${pid} 语义至初始加载状态`
                  : "该裁片已处于初始状态，无需重置",
              );
            },
            { confirmText: "确认重置", confirmClass: "primary" },
          );
        };
        $("#pseTempBtn").onclick = () => {
          // 按下时按当前生效模式校验：校验通过才执行保存；未通过则显示报红与错误提示
          clearFieldError();
          if (modeToggle.checked) {
            const cn = customCn.value.trim();
            const sid = customSid.value.trim();
            const cnOk = cn !== "";
            const sidOk = /^[a-zA-Z0-9_]+$/.test(sid);
            if (!cnOk) customCn.classList.add("invalid");
            if (!sidOk) customSid.classList.add("invalid");
            if (!(cnOk && sidOk)) {
              customSemError.textContent =
                !cnOk && !sidOk
                  ? "请填写中文语义与有效的 semantic_id（字母、数字、下划线）"
                  : !cnOk
                    ? "请填写中文语义"
                    : "semantic_id 仅支持字母、数字、下划线";
              toast("请先完成自定义语义填写后再临时保存");
              return;
            }
          } else if (!subSel.value) {
            catSel.classList.add("invalid");
            subSel.classList.add("invalid");
            catSemError.textContent =
              "请选择语义类别并完成最末级子类别选择后再临时保存";
            toast("请先完成语义类别子类别选择后再临时保存");
            return;
          }
          // 无临时修改时的兜底：若已有已提交的草稿则仅刷新本地草稿，避免误报
          if (!pendingEdits.size) {
            const n = dirtyPanelCount();
            if (!n) {
              toast("没有待临时保存的修改");
              return;
            }
            refreshDirty();
            toast(`已临时保存 ${n} 个已提交的修改（本地草稿）`);
            return;
          }
          // 提交所有临时（pending）修改到 panel：写回 role/name、草稿、撤销栈与修改记录
          let committed = 0;
          for (const [pid, pend] of [...pendingEdits.entries()]) {
            const p = garment.panels.find((x) => x.panel_id === pid);
            if (!p) {
              pendingEdits.delete(pid);
              continue;
            }
            const hBefore = { role: p.role || "", name: String(p.name || "") };
            let dirtyRole = false;
            let dirtyName = false;
            if (
              pend.role !== undefined &&
              String(pend.role) !== String(p.role || "")
            ) {
              p.role = pend.role;
              const orole = panelOriginalRoleMap.has(pid)
                ? panelOriginalRoleMap.get(pid)
                : p.role;
              if (p.role !== orole) draftRoles.set(pid, p.role);
              else draftRoles.delete(pid);
              dirtyRole = true;
            }
            if (
              pend.name !== undefined &&
              String(pend.name) !== String(p.name || "")
            ) {
              p.name = pend.name;
              const oname = panelOriginalNameMap.has(pid)
                ? panelOriginalNameMap.get(pid)
                : String(p.name);
              if (String(p.name) !== String(oname)) draftNames.set(pid, p.name);
              else draftNames.delete(pid);
              dirtyName = true;
            }
            if (dirtyRole || dirtyName) {
              semEditHistory.push({
                panelId: pid,
                roleBefore: hBefore.role,
                nameBefore: hBefore.name,
              });
              recordPanelChange(p, hBefore);
              committed++;
            }
            // 提交后若已与现值一致则移除该项
            const effR = pend.role !== undefined ? pend.role : p.role || "";
            const effN =
              pend.name !== undefined ? pend.name : String(p.name || "");
            if (
              String(effR) === String(p.role) &&
              String(effN) === String(p.name || "")
            )
              pendingEdits.delete(pid);
          }
          if (committed) {
            refreshDirty();
            toast(`已临时保存 ${committed} 个裁片语义修改（本地草稿）`);
          } else {
            pendingEdits.clear();
            toast("没有可提交的语义修改");
          }
          renderPanelSemEditor();
          renderPanelList();
          renderCanvas();
        };
        // 刷新侧边栏下半部分的修改记录（与语义编辑器同屏展示）
        renderSidebarHistory();
      }

      function renderStitchList() {
        if (!seam || !seam.stitches || !seam.stitches.length) {
          $("#stitchList").innerHTML =
            '<div class="empty-state">请加载 Seam JSON</div>';
          $("#stitchCount").textContent = seam?.stitches?.length || 0;
          return;
        }
        $("#stitchCount").textContent = seam.stitches.length;
        $("#stitchList").innerHTML = seam.stitches
          .map((s) => {
            const type = s.type || "seam";
            const groups = s.edge_sets ? s.edge_sets.length : 0;
            const aCount = (s.a_edges || []).length;
            const bCount = (s.b_edges || []).length;
            const isGroup = groups > 2;
            const badge =
              (s.source === "manual"
                ? '<span class="stitch-badge manual-badge">人工</span>'
                : "") +
              (isGroup
                ? '<span class="stitch-badge group-badge">多对多</span>'
                : "");
            const meta = isGroup
              ? `${esc(type)} · ${groups} 条组边互缝 (共${aCount + bCount}边)`
              : `${esc(type)} · A侧${aCount}边 ↔ B侧${bCount}边`;
            return `<div class="list-item${hoveredStitchId === s.stitch_id ? " highlight" : ""}${selectedStitchId === s.stitch_id ? " active" : ""}" data-stitch="${esc(s.stitch_id)}">
      <span class="item-info">
        <span class="item-title">${esc(s.stitch_id)} ${badge}</span>
        <span class="item-sub">${meta}</span>
      </span>
      <button type="button" class="item-delete" data-delete="${esc(s.stitch_id)}" title="删除此缝合关系">×</button>
    </div>`;
          })
          .join("");

        document.querySelectorAll("[data-stitch]").forEach((el) => {
          el.onmouseenter = () => highlightStitch(el.dataset.stitch);
          el.onmouseleave = () => clearStitchHighlight();
        });
        // 容器级鼠标离开：光标彻底移出列表区域时取消所有高亮。
        // 不能只依赖单个 item 的 mouseleave——highlightStitch 会通过
        // renderAll() 重建列表 DOM，被替换的旧 item 无法触发 mouseleave，
        // 导致离开后高亮残留。容器本身不随重绘被替换，适合兜底清空。
        const stitchListEl = document.getElementById("stitchList");
        stitchListEl.onmouseleave = () => clearStitchHighlight();
      }

      function renderTitle() {
        const parts = [];
        if (garmentFileName) parts.push(garmentFileName);
        if (garment?.garment_id) parts.push(garment.garment_id);
        if (garment?.garment_type) parts.push(garment.garment_type);
        if (garment?.panels) parts.push(`${garment.panels.length} 裁片`);
        if (seam?.stitches) parts.push(`${seam.stitches.length} 缝合关系`);
        $("#garmentInfo").textContent = parts.join(" · ") || "未加载数据";
      }

      function renderAll() {
        renderTitle();
        renderPanelList();
        renderStitchList();
        renderPanelSemEditor();
        renderCanvas();
        updateSaveBtn();
        updateDirtyBadge();
      }

      // ============ 删除 / 保存 ============
      function updateSaveBtn() {
        const hasSeam = !!(seam && Array.isArray(seam.stitches));
        $("#saveBtn").disabled = !hasSeam;
        // 裁片语义保存按钮：加载了 garment 数据后方可保存
        $("#saveGarmentBtn").disabled = !garment;
      }

      const modalOverlay = $("#modalOverlay");
      const modalConfirmBtn = $("#modalConfirmBtn");
      let modalOnConfirm = null;

      function openConfirmModal(title, message, onConfirm, opts) {
        opts = opts || {};
        $("#modalTitle").textContent = title;
        // 转义后以 <br> 渲染换行，安全展示多行信息
        $("#modalMessage").innerHTML = esc(message).replace(/\n/g, "<br>");
        modalConfirmBtn.textContent = opts.confirmText || "确认删除";
        modalConfirmBtn.classList.remove("danger", "primary");
        modalConfirmBtn.classList.add(opts.confirmClass || "danger");
        modalOnConfirm = onConfirm;
        modalOverlay.classList.add("show");
      }

      function closeModal() {
        modalOverlay.classList.remove("show");
        modalOnConfirm = null;
        // 还原确认按钮默认样式
        modalConfirmBtn.textContent = "确认删除";
        modalConfirmBtn.classList.remove("primary");
        modalConfirmBtn.classList.add("danger");
      }

      function deleteStitch(stitchId) {
        const s = (seam?.stitches || []).find((x) => x.stitch_id === stitchId);
        if (!s) {
          toast(`未找到缝合关系 ${stitchId}，请先加载对应的 Seam JSON`);
          return;
        }
        openConfirmModal(
          "删除缝合关系",
          `确定要删除 ${stitchId} 吗？（${s.relation || s.type || "seam"}）删除后需保存 JSON 才能持久化，此操作不可撤销。`,
          () => {
            const idx = seam.stitches.findIndex(
              (x) => x.stitch_id === stitchId,
            );
            if (idx >= 0) {
              const removed = seam.stitches[idx];
              const rel = removed.relation || removed.type || "seam";
              seam.stitches.splice(idx, 1);
              if (hoveredStitchId === stitchId) hoveredStitchId = null;
              if (selectedStitchId === stitchId) {
                selectedStitchId = null;
                if (rightPanelKey === "sde") setRightPanel(null);
              }
              sdCache.delete(stitchId);
              recordSeamChange(
                "删除缝合",
                stitchId,
                { stitch_id: stitchId, relation: rel },
                {},
                [
                  {
                    field: "缝合关系",
                    from: `${rel} / ${stitchId}`,
                    to: "（已删除）",
                  },
                ],
                `删除缝合 ${stitchId}（${rel}）`,
              );
              renderAll();
              toast(`已删除 ${stitchId}`);
            }
          },
        );
      }

      function saveSeamJson() {
        if (!seam) {
          toast("未加载 Seam 数据");
          return;
        }
        let name = seamFileName;
        if (!name) {
          const base = (garmentFileName || "").replace(
            /\.garment\..*\.json$/,
            "",
          );
          name = base ? `${base}.seam.reviewed.json` : "seam.reviewed.json";
        }
        const blob = new Blob([JSON.stringify(seam, null, 2)], {
          type: "application/json",
        });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = name;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 500);
        // 保存后：当前内存状态即为各 item 的“最近一次保存”基线，后续重置将回退至此。
        // 序列化取的是此时的 seam 对象，因此所有就地编辑（含起点/终点交换）均已写入 JSON。
        stitchItemBaseline.clear();
        dirtyStitchSet.clear();
        for (const st of seam.stitches) commitStitchItemBaseline(st);
        updateSdDirtyBadge();
        recordSeamChange(
          "保存 Seam JSON",
          name,
          {},
          { file: name, stitches: seam.stitches.length },
          [{ field: "文件", from: "（内存）", to: name }],
          `保存缝合关系到 ${name}（${seam.stitches.length} 条缝合关系）`,
        );
        toast(`已保存: ${name}（${seam.stitches.length} 条缝合关系）`);
      }

      // 保存裁片语义：将修改后的 panel.role 序列化为 Garment JSON 下载。
      // 文件名沿用加载时的 garmentFileName（默认 {base}.garment.reviewed.json），
      // 与系统其他模块（语义库 / seam-preview）对 garment JSON 的约定保持一致。
      function saveGarmentJson() {
        if (!garment) {
          toast("未加载 Garment 数据");
          return;
        }
        let name = garmentFileName || "garment.reviewed.json";
        if (!/\.json$/i.test(name)) name = name + ".json";
        let json;
        try {
          json = JSON.stringify(garment, null, 2);
        } catch (e) {
          toast("保存失败：Garment 数据无法序列化");
          return;
        }
        const blob = new Blob([json], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = name;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 500);
        // 保存成功后以当前 role / 自定义名为新的“原始值”（撤销基于保存后的状态），并清除临时草稿
        panelOriginalRoleMap = new Map();
        panelOriginalNameMap = new Map();
        for (const p of garment.panels || []) {
          panelOriginalRoleMap.set(p.panel_id, p.role || "");
          panelOriginalNameMap.set(p.panel_id, String(p.name || ""));
        }
        clearDraft();
        updateDirtyBadge();
        pushHistory(
          makeHistoryEntry(
            "panel",
            "保存 Garment JSON",
            name,
            {},
            { file: name, panels: garment.panels.length },
            [{ field: "文件", from: "（内存）", to: name }],
            `保存裁片语义到 ${name}（${garment.panels.length} 裁片）`,
          ),
        );
        toast(`已保存裁片语义: ${name}（${garment.panels.length} 裁片）`);
      }

      // ============ 人工缝合 - 交互控制 ============
      const manualStitchBtn = $("#manualStitchBtn");
      const rubberBand = $("#rubberBand");
      const manualStatusEl = $("#manualStatus");
      const manualSideTag = $("#manualSideTag");
      const manualInfoEl = $("#manualInfo");
      // 鼠标操作完全由“左右键 + 模式”驱动：左键框选/点选，右键平移画布
      function updateCanvasCursor() {
        svg.classList.remove("grabbable");
        svg.style.cursor = manualMode.active ? "crosshair" : "";
      }
      const manualActiveBanner = $("#manualActiveBanner");
      let manualAreaRect = null;

      // 人工缝合模式状态指示
      function setManualModeIndicator(show) {
        if (show) {
          manualActiveBanner.classList.add("show");
          manualStitchBtn.classList.add("active");
        } else {
          manualActiveBanner.classList.remove("show");
          manualStitchBtn.classList.remove("active");
          manualStatusEl.textContent = "就绪";
          manualSideTag.textContent = "0";
          // 确认缝合已常驻底部状态栏，退出人工模式时需复位禁用
          $("#manualConfirmBtn").disabled = true;
        }
        updateCanvasCursor(); // 光标由当前工具决定
      }

      function manualArea() {
        return document.getElementById("canvasArea").getBoundingClientRect();
      }

      function manualExit() {
        // 退出人工缝合工具，保留已建关系（仅撤掉工具态与选择）
        manualMode.active = false;
        manualMode.box = null;
        manualMode.selections = [];
        manualMode.selectedIdx = -1;
        manualMode.dragging = false;
        manualMode.pendingCapHalf = null;
        rubberBand.classList.remove("show");
        setManualModeIndicator(false);
        renderCanvas();
        refreshManualSelectionPanel(); // 退出时隐藏已选边列表
      }

      function manualClearSelection() {
        // 重置：清除当前所有已选中的组边，回到“零选择”状态，工具保持激活
        manualMode.box = null;
        manualMode.selections = [];
        manualMode.selectedIdx = -1;
        manualMode.dragging = false;
        rubberBand.classList.remove("show");
        renderCanvas();
        updateManualBar();
      }

      function manualCancel() {
        // 撤销最近一次添加的组边（Esc 用）；无选择时退出工具
        if (manualMode.selections.length) {
          manualMode.selections.pop();
          manualMode.selectedIdx = -1;
        }
        updateManualBar();
        renderCanvas();
      }

      // 移除指定索引的已选组边
      function removeSelectedChain(idx) {
        if (idx < 0 || idx >= manualMode.selections.length) return;
        manualMode.selections.splice(idx, 1);
        if (manualMode.selectedIdx === idx) manualMode.selectedIdx = -1;
        else if (manualMode.selectedIdx > idx) manualMode.selectedIdx--;
        updateManualBar();
        renderCanvas();
      }

      function updateManualBar() {
        if (!manualMode.active) {
          manualActiveBanner.classList.remove("show");
          return;
        }
        manualActiveBanner.classList.add("show");
        const n = manualMode.selections.length;
        const confirmBtn = $("#manualConfirmBtn");
        manualSideTag.textContent = String(n);
        manualSideTag.classList.toggle("b", false);
        if (n === 0) {
          manualStatusEl.textContent =
            "请框选组边（可多次框选累积多条，点击/悬停栏可移除）";
          confirmBtn.disabled = true;
          manualInfoEl.textContent = "";
        } else if (n === 1) {
          manualStatusEl.textContent =
            "已选 1 条组边，可继续框选更多，或多选 2 条以上后确认互缝";
          confirmBtn.disabled = true;
          const s = manualMode.selections[0];
          manualInfoEl.textContent = `#1 ${s.panelId} · ${s.edgeIds.length} 边 · ${s.length.toFixed(0)}mm`;
        } else {
          manualStatusEl.textContent = `已选 ${n} 条组边，点击“确认缝合”建立多对多互缝关系`;
          confirmBtn.disabled = false;
          const parts = manualMode.selections
            .map((s, i) => `#${i + 1} ${s.panelId}·${s.length.toFixed(0)}mm`)
            .join(" ；");
          manualInfoEl.textContent = parts;
        }
        // 已选边列表与选择状态实时同步
        refreshManualSelectionPanel();
      }

      function showRubberBand() {
        rubberBand.classList.add("show");
      }

      // 已选边列表抽屉：从 manualMode.selections 实时展示所有已选组边
      const manualSelectedList = $("#manualSelectedList");
      const manualSelectedCount = $("#manualSelectedCount");
      function refreshManualSelectionPanel() {
        if (!manualMode.active) {
          // 仅当当前展示的就是“已选边”时才隐藏侧栏，避免误关其它模块
          if (rightPanelKey === "msp") setRightPanel(null);
          manualSelectedList.innerHTML = "";
          manualSelectedCount.textContent = "0";
          return;
        }
        const chains = manualMode.selections;
        // 统计所有已选小边数量
        const totalEdges = chains.reduce((s, c) => s + c.edgeIds.length, 0);
        manualSelectedCount.textContent = String(totalEdges);
        setRightPanel("msp");
        if (!chains.length) {
          manualSelectedList.innerHTML =
            '<div class="msp-empty">框选组边以累积选择（可多次框选）</div>';
          return;
        }
        manualSelectedList.innerHTML = chains
          .map((c, i) => {
            // 以“由多组小边组合而成的大边(edge_group)”为语义展示基准
            const panel = (garment?.panels || []).find(
              (p) => p.panel_id === c.panelId,
            );
            const gidSet = new Set(c.groupIds || []);
            const selGroups = panel
              ? edgeGroupsOfPanel(panel).filter((g) => gidSet.has(g.group_id))
              : [];
            return `<div class="selected-edge-group${i === manualMode.selectedIdx ? " sel-active" : ""}" data-idx="${i}">
        <div class="seg-header">
          <span class="seg-side" style="background:${chainColor(i)}">${i + 1}</span>
          <span class="seg-title" title="${esc(c.panelId)}">${esc(c.panelId)}</span>
          <span class="seg-count">${c.edgeIds.length} 小边 / ${c.length.toFixed(0)}mm</span>
          <button type="button" class="seg-remove" data-del-idx="${i}" title="移除该组边">×</button>
        </div>
        <div class="seg-list">
          ${
            selGroups.length
              ? selGroups
                  .map((g) => {
                    const sname = edgeSemanticName(g.role);
                    const gLabel =
                      "大边 " + String(g.group_id).split(".").pop();
                    return `<div class="selected-edge-item" data-group="${esc(g.group_id)}" title="${esc(g.group_id)}">
            <span class="e-dot" style="background:${chainColor(i)}"></span>
            <span class="e-id" title="大边 ${esc(g.group_id)} · ${g.member_edge_ids.length} 段小边">${esc(gLabel)}</span>
            <span class="e-sem">${g.member_edge_ids.length} 段</span>
            ${sname ? `<span class="e-sem" title="语义：${esc(sname)}">${esc(sname)}</span>` : ""}
          </div>`;
                  })
                  .join("")
              : (c.edgeIds || [])
                  .map(
                    (
                      eid,
                    ) => `<div class="selected-edge-item" data-edge="${esc(eid)}">
            <span class="e-dot" style="background:${chainColor(i)}"></span>
            <span class="e-id" title="${esc(eid)}">${esc(eid)}</span>
          </div>`,
                  )
                  .join("")
          }
        </div>
      </div>`;
          })
          .join("");
      }

      function refreshRubberBand() {
        const b = manualMode.box;
        if (!b) return;
        const x = Math.min(b.x0, b.x1);
        const y = Math.min(b.y0, b.y1);
        rubberBand.style.left = x + "px";
        rubberBand.style.top = y + "px";
        rubberBand.style.width = Math.abs(b.x1 - b.x0) + "px";
        rubberBand.style.height = Math.abs(b.y1 - b.y0) + "px";
      }
      function hideRubberBand() {
        rubberBand.classList.remove("show");
      }

      // 计算一条选择链的语义摘要：{panelSem: 裁片语义中文名, edgeSems: {语义名: 大边条数}}
      // 以“由多组小边组合而成的大边(edge_group)”为语义统计基准。
      function chainSemanticInfo(sel) {
        const edgeSems = {};
        for (const gid of sel.groupIds || []) {
          const role = groupRoleById(sel.panelId, gid);
          // 降级策略：命中映射→中文名；role 为空→无有效语义，不纳入统计；
          // 映射缺失但确有有效 role→显式展示原始 role（“未收录:...”，绝不误标为“未分类边”）。
          // 仅当 role 本身为 unknown_edge（edgeSemanticName 已映射为“未分类边”）时才算未分类。
          const sname =
            edgeSemanticName(role) || (!role ? "" : `未收录:${role}`);
          if (!sname) continue;
          edgeSems[sname] = (edgeSems[sname] || 0) + 1;
        }
        // 裁片语义：以链所属面板的 role 解析
        let panelSem = "";
        const panel = (garment?.panels || []).find(
          (p) => p.panel_id === sel.panelId,
        );
        if (panel) panelSem = panelSemanticName(panel.role) || "";
        return { panelSem, edgeSems };
      }

      // 一次框选 → 命中 → 扩选 → 追加为一条新组边到选择集（多选累积）
      function applyBoxSelection(b) {
        const hits = selectionFromBox(b.x0, b.y0, b.x1, b.y1);
        if (!hits.length) {
          toast("未选中任何边，请重新框选");
          return;
        }
        const sel = chainExpand(hits);
        if (!sel) {
          toast("未能形成有效边链");
          return;
        }
        // 语义即时提示：选中后立即展示选中边的完整语义名称摘要
        const sinfo = chainSemanticInfo(sel);
        const semParts = Object.entries(sinfo.edgeSems)
          .map(([k, n]) => (n > 1 ? `${k}×${n}` : k))
          .join("、");
        const selPanelName = sinfo.panelSem
          ? `${sel.panelId}（${sinfo.panelSem}）`
          : sel.panelId;
        toast(
          `已选中 ${sel.edgeIds.length} 条小边（${sel.groupIds.length} 条大边）：${selPanelName}\n大边语义：${
            semParts || "未分类"
          }`,
        );
        // 袖山弧线智能分割：若为袖片拱形弧，在最高点切成前/后两半。
        // 前半立即加入选择集用于配对，后半暂存 pending，配好前半后自动带入。
        const capHalves = trySplitSleeveCap(sel);
        if (capHalves.length === 2) {
          manualMode.pendingCapHalf = capHalves[1];
          addSelectionChain(capHalves[0], true);
          toast(
            `袖山弧线已按最高点分割：前半已选入 #${manualMode.selections.length}，` +
              `配好前半后会自动带入后半继续配对`,
          );
        } else {
          // 若之前有暂存的后半已由用户手动再次框选，则忽略旧的 pending 以免重复
          if (sameChain(manualMode.pendingCapHalf, sel))
            manualMode.pendingCapHalf = null;
          addSelectionChain(sel, false);
        }
        updateManualBar();
        renderCanvas();
      }

      // 通用：把一条链加入选择集（支持替换式去重，可选覆盖提示）
      function addSelectionChain(sel, silent) {
        // 去重：若新链与已选组边共享任意小边，则替换而非追加（避免重复计数）
        const dupIdx = manualMode.selections.findIndex((c) =>
          c.edgeIds.some((eid) => sel.edgeIds.includes(eid)),
        );
        if (dupIdx >= 0) {
          manualMode.selections[dupIdx] = sel;
          if (!silent) toast(`已更新组边 #${dupIdx + 1}`);
        } else {
          // 冲突提示（不阻断）：所选边可能已被现有缝合关系占用
          if (!silent) {
            const conflicts = occupiedByStitch(sel.edgeIds);
            if (conflicts.length) {
              const names = conflicts
                .map((s) => s.stitch_id || s.type || "stitch")
                .join("、");
              toast(`提示：所选边已参与 ${names}，可继续但请注意重复`);
            }
          }
          manualMode.selections.push(sel);
          manualMode.selectedIdx = manualMode.selections.length - 1;
        }
      }

      // 判断两条选择链是否覆盖相同的边集合（用于去重/忽略 pending）
      function sameChain(a, b) {
        if (!a || !b || !a.edgeIds || !b.edgeIds) return false;
        if (a.edgeIds.length !== b.edgeIds.length) return false;
        const setB = new Set(b.edgeIds);
        return a.edgeIds.every((e) => setB.has(e));
      }

      // 多对多：取缝合关系中各参与组边的边数组（edge_sets，回退兼容 a_edges/b_edges）
      function stitchSideEdgeGroups(s) {
        if (s && Array.isArray(s.edge_sets) && s.edge_sets.length) {
          return s.edge_sets.map((gs) => gs.edge_ids || gs.edges || []);
        }
        return [s?.a_edges || [], s?.b_edges || []];
      }

      // 取缝合关系涉及的全部小边 id（含多对多情况）
      function stitchAllEdges(s) {
        return stitchSideEdgeGroups(s).flat();
      }

      // 返回占用给定边的现有缝合关系
      function occupiedByStitch(edgeIds) {
        if (!seam || !seam.stitches) return [];
        const occ = new Set(edgeIds);
        return seam.stitches.filter((s) =>
          stitchAllEdges(s).some((e) => occ.has(e)),
        );
      }

      // 校验并生成 stitch_id
      function nextStitchId() {
        let max = 0;
        for (const s of seam?.stitches || []) {
          const m = /stitch_(\d+)$/.exec(s.stitch_id || "");
          if (m) max = Math.max(max, parseInt(m[1], 10));
        }
        return `stitch_${String(max + 1).padStart(3, "0")}`;
      }

      // 生成 point_matches（按端点距离最小化选择方向）
      // 规范化方向：0.1mm 取整防浮点抖动（与顶点聚类一致）
      function needsSwap(p1, p2) {
        if (!p1 || !p2 || p1.length < 2 || p2.length < 2) return false;
        const a = Math.round(p1[0] * 10);
        const b = Math.round(p2[0] * 10);
        if (a !== b) return a > b; // p1 更右 -> 需交换
        return Math.round(p1[1] * 10) < Math.round(p2[1] * 10); // x 同，p1 更下 -> 需交换
      }
      // 对单条大边（组合边）做方向规范化：起点=更左/更上
      function canonicalChain(c) {
        if (!c || !c.startPoint || !c.endPoint) return c;
        const s = c.startPoint;
        const e = c.endPoint;
        if (!needsSwap(s, e)) return c;
        return {
          ...c,
          startPoint: e.slice(),
          endPoint: s.slice(),
          edgeIds: (c.edgeIds || []).slice().reverse(),
        };
      }

      function buildPointMatches(A, B) {
        const a0 = A.edgeIds[0];
        const a1 = A.edgeIds[A.edgeIds.length - 1];
        const b0 = B.edgeIds[0];
        const b1 = B.edgeIds[B.edgeIds.length - 1];
        const dist = ([p1, p2]) => Math.hypot(p1[0] - p2[0], p1[1] - p2[1]);
        // 正向：a首-b首，a尾-b尾；反向：a首-b尾，a尾-b首
        const straight =
          dist(A.startPoint, B.startPoint) + dist(A.endPoint, B.endPoint);
        const crossed =
          dist(A.startPoint, B.endPoint) + dist(A.endPoint, B.startPoint);
        if (straight <= crossed) {
          return [
            {
              a: { edge_id: a0, endpoint: "start" },
              b: { edge_id: b0, endpoint: "start" },
            },
            {
              a: { edge_id: a1, endpoint: "end" },
              b: { edge_id: b1, endpoint: "end" },
            },
          ];
        }
        return [
          {
            a: { edge_id: a0, endpoint: "start" },
            b: { edge_id: b1, endpoint: "end" },
          },
          {
            a: { edge_id: a1, endpoint: "end" },
            b: { edge_id: b0, endpoint: "start" },
          },
        ];
      }

      // ── 滚边条 ↔ 大身前后片领口 一对多端点点对应（人工缝合专用）──
      // 与后端 semantics._binding_neckline_stitch 同款规则：
      //   滚边条长边作为主侧(a)，大身前后片领口为从侧(b)；
      //   以面板质心 x 较小者为大身前片、较大者为大身后片。
      //   映射：a.L↔前片领口R、a.R↔前片领口L、a.L↔后片领口L、a.R↔后片领口R。
      const BODICE_PANEL_ROLES = new Set([
        "front_bodice",
        "back_bodice",
        "right_front_bodice",
        "left_front_bodice",
        "right_back_bodice",
        "left_back_bodice",
        "back_yoke",
      ]);
      // 检测是否命中「滚边条长边 ↔ 大身前后片领口」一对多场景；未命中返回 null。
      // 命中后返回 { bindIndex, neck: [neckIndex...] }，其中 neck 已按质心 x 升序（前片在前）。
      function detectBindingNeckline(chains) {
        const panels = garment?.panels || [];
        const lookup = {};
        for (const p of panels) lookup[p.panel_id] = p;
        const bindIndex = chains.findIndex(
          (c) => /binding/i.test((lookup[c.panelId]?.role) || ""),
        );
        if (bindIndex < 0) return null;
        const neck = [];
        for (let i = 0; i < chains.length; i++) {
          if (i === bindIndex) continue;
          const p = lookup[chains[i].panelId];
          if (!p || !BODICE_PANEL_ROLES.has(p.role)) return null;
          neck.push({ i, cx: (p.bbox.min_x + p.bbox.max_x) / 2 });
        }
        if (neck.length === 0) return null;
        neck.sort((x, y) => x.cx - y.cx);
        return { bindIndex, neck: neck.map((n) => n.i) };
      }
      // 为已命中场景生成四点对应（调用前 chains 需满足：chains[0]=滚边条、其后按前后片排列，
      // 且各条组边已通过 canonicalChain 规范化——起点=更左/更上）。
      function bindingNecklineMatches(chains) {
        const aFirst = { edge_id: chains[0].edgeIds[0], endpoint: "start" };
        const aLast = {
          edge_id: chains[0].edgeIds[chains[0].edgeIds.length - 1],
          endpoint: "end",
        };
        const chainRefs = (c) => ({
          first: { edge_id: c.edgeIds[0], endpoint: "start" },
          last: {
            edge_id: c.edgeIds[c.edgeIds.length - 1],
            endpoint: "end",
          },
        });
        const out = [];
        const front = chains[1];
        if (front) {
          const f = chainRefs(front);
          out.push({ a: aFirst, b: f.last }); // a.L ↔ 前片领口 R
          out.push({ a: aLast, b: f.first }); // a.R ↔ 前片领口 L
        }
        const back = chains[2];
        if (back) {
          const bk = chainRefs(back);
          out.push({ a: aFirst, b: bk.first }); // a.L ↔ 后片领口 L
          out.push({ a: aLast, b: bk.last }); // a.R ↔ 后片领口 R
        }
        return out;
      }

      // 二次确认弹窗入口：点击“确认缝合”后弹出，经用户确认才真正建立关系
      function manualConfirm() {
        const chains = manualMode.selections;
        if (chains.length < 2) {
          toast("请至少框选 2 条组边后再确认缝合");
          return;
        }
        // 同裁片校验：同一裁片只能出现一条组边；
        // 袖片与滚边条允许同裁片上的多条（前/后袖缝、滚边两缘等）互缝
        const byPanel = {};
        for (const c of chains) {
          (byPanel[c.panelId] = byPanel[c.panelId] || []).push(c);
        }
        for (const pid in byPanel) {
          if (byPanel[pid].length > 1 && !isMultiChainPanel(pid)) {
            toast(
              `裁片「${pid}」出现了多个组边（非袖片/滚边条），请仅保留其一后重选`,
            );
            return;
          }
        }
        const desc = chains
          .map(
            (c, i) =>
              `#${i + 1}「${c.panelId}」（${c.edgeIds.length} 边 / ${c.length.toFixed(0)}mm）`,
          )
          .join(" 与 ");
        openConfirmModal(
          "确认多对多缝合关系",
          `确定要为以下 ${chains.length} 条组边建立相互缝合关联吗？\n${desc}` +
            `\n\n确认后将写入缝合关系 JSON（多对多 seam_group），需保存后才永久生效。`,
          () => createManualStitch(),
          {
            confirmText: `确认缝合（${chains.length} 条）`,
            confirmClass: "primary",
          },
        );
      }

      // 判断裁片是否为袖片（role 含 'sleeve'），允许其同裁片前后袖缝互缝
      function isSleevePanel(panelId) {
        const p = (garment?.panels || []).find((x) => x.panel_id === panelId);
        return !!(p && /sleeve/i.test(p.role || ""));
      }

      // 判断裁片是否允许同裁片多组边互缝：
      // 袖片（role 含 'sleeve'）与滚边条（role 含 'binding'，如 binding_strip / bias_binding）
      // 允许两条边建立缝合关系，其余裁片类型仍保持单组边限制
      function isMultiChainPanel(panelId) {
        const p = (garment?.panels || []).find((x) => x.panel_id === panelId);
        if (!p) return false;
        const role = (p.role || "").toLowerCase();
        return role.includes("sleeve") || role.includes("binding");
      }

      function createManualStitch() {
        const chains = manualMode.selections.slice();
        if (chains.length < 2) return;
        // 滚边条 ↔ 大身前后片领口 一对多：命中时重排主侧，使滚边条置顶、领口按前后片排列
        const bindingNeck = detectBindingNeckline(chains);
        if (bindingNeck) {
          const bind = chains[bindingNeck.bindIndex];
          const reorder = [bind];
          for (const idx of bindingNeck.neck) reorder.push(chains[idx]);
          chains.length = 0;
          chains.push(...reorder);
        }
        // 统一方向：同一裁片内从左到右、从上到下（每条约边各自规范化起点）
        for (let i = 0; i < chains.length; i++)
          chains[i] = canonicalChain(chains[i]);
        const stitchId = nextStitchId();
        const finite = (v) => (Number.isFinite(v) ? v : 0);

        // 通用多对多数据：edge_sets 记录每条参与组边（含裁片、边、组、端点、长度）
        const edge_sets = chains.map((c, i) => ({
          chain_index: i,
          panel_id: c.panelId,
          edge_ids: c.edgeIds.slice(),
          group_ids: (c.groupIds || []).slice(),
          start_point: c.startPoint.slice(),
          end_point: c.endPoint.slice(),
          length: finite(c.length),
        }));

        // 兼容字段：主链为第一条，其余合并为 b 侧（便于旧消费者读取）
        const A = chains[0];
        const B = { edgeIds: chains.slice(1).flatMap((c) => c.edgeIds) };
        const aLen = finite(A.length);
        const bLen = chains.slice(1).reduce((s, c) => s + finite(c.length), 0);
        const minLen = Math.max(Math.min(aLen, bLen), 1);
        // 多对多：所有参与组边两两配对索引（完全互缝）
        const paired_indices = [];
        for (let i = 0; i < chains.length; i++) {
          for (let j = i + 1; j < chains.length; j++) {
            paired_indices.push([i, j]);
          }
        }
        const stitch = {
          stitch_id: stitchId,
          type: "seam",
          relation: chains.length === 2 ? "seam_pair" : "seam_group",
          a: A.edgeIds[0],
          b: chains.length > 1 ? chains[1].edgeIds[0] : A.edgeIds[0],
          a_edges: A.edgeIds,
          b_edges: B.edgeIds,
          a_groups: A.groupIds,
          b_groups: chains.slice(1).flatMap((c) => c.groupIds || []),
          // 多对多核心结构
          edge_sets,
          paired_indices, // 组边索引对：互相缝合关系
          direction: "by_points",
          point_matches: bindingNeck
            ? bindingNecklineMatches(chains)
            : chains.length >= 2
              ? buildPointMatches(A, chains[1])
              : [],
          length_tolerance: Math.abs(aLen - bLen) / minLen,
          confidence: 1,
          review_status: "pending_review",
          source: "manual",
        };
        seam = seam || {
          schema_version: 1,
          garment_id: "",
          status: "draft",
          stitches: [],
        };
        if (!Array.isArray(seam.stitches)) seam.stitches = [];
        seam.stitches.unshift(stitch);
        toast(`已添加人工缝合关系 ${stitchId}（${chains.length} 条组边互缝）`);
        recordSeamChange(
          "新增缝合",
          stitchId,
          {},
          {
            stitch_id: stitchId,
            relation: stitch.relation,
            panels: chains.map((c) => c.panelId),
          },
          [
            {
              field: "缝合关系",
              from: "（无）",
              to: `${stitch.relation} / ${stitchId}`,
            },
          ],
          `新增缝合 ${stitchId}（${stitch.relation}）`,
        );
        // 若存在袖山分割暂存的后半弧，把它自动带入下一轮选择，便于紧接着配后半与另一侧袖窿
        const pending = manualMode.pendingCapHalf;
        manualMode.pendingCapHalf = null;
        manualClearSelection();
        if (pending && manualMode.active) {
          addSelectionChain(pending, true);
          toast(
            `已自动带入袖山后半（#${manualMode.selections.length}），` +
              `请继续框选另一侧袖窿以完成配对`,
          );
        }
        updateSaveBtn();
        renderAll();
        updateManualBar();
      }

      // 工具开关
      manualStitchBtn.onclick = () => {
        if (!garment) {
          toast("请先加载 Garment JSON");
          return;
        }
        if (!manualMode.active) {
          // 进入人工缝合模式时自动关闭裁片语义编辑栏，避免两功能并列冲突
          if (focusedPanelId) {
            focusedPanelId = null;
            setRightPanel(null); // 收起当前语义编辑栏；随后 updateManualBar 会打开“已选边”栏
            renderPanelList(); // 同步清除左侧选中态，保持 UI 一致
          }
          manualMode.active = true;
          setManualModeIndicator(true);
          if (manualAdj && Object.keys(manualAdj).length === 0) {
            buildManualAdjacency();
          }
          updateManualBar();
        } else {
          manualExit();
        }
      };
      $("#manualResetBtn").onclick = manualClearSelection;
      $("#manualConfirmBtn").onclick = manualConfirm;

      // 袖山弧线分割开关
      $("#splitCapBtn").onclick = () => {
        manualMode.splitCap = !manualMode.splitCap;
        manualMode.pendingCapHalf = null;
        updateSplitCapBtn();
      };
      function updateSplitCapBtn() {
        const btn = $("#splitCapBtn");
        if (!btn) return;
        btn.classList.toggle("active", manualMode.splitCap);
        btn.textContent = manualMode.splitCap ? "袖山分割" : "不分割";
      }
      updateSplitCapBtn();

      // 已选边列表交互（容器级事件委托）：
      //     点击各组边 → 切换该组边高亮；点击 × → 立即移除（不再二次确认）
      manualSelectedList.addEventListener("click", (e) => {
        const btn = e.target.closest("[data-del-idx]");
        const item = e.target.closest("[data-idx]");
        if (btn) {
          removeSelectedChain(
            parseInt(e.target.closest("[data-del-idx]").dataset.delIdx, 10),
          );
          return;
        }
        if (item) {
          const idx = parseInt(item.dataset.idx, 10);
          manualMode.selectedIdx = manualMode.selectedIdx === idx ? -1 : idx;
          updateManualBar();
          renderCanvas();
        }
      });

      // 画布框选交互（人工模式：仅左键框选，右键交给平移）
      const mArea = document.getElementById("canvasArea");
      mArea.addEventListener("pointerdown", (e) => {
        if (!manualMode.active || e.button !== 0) return;
        // 点击操作条/工具切换栏时不应触发框选
        if (
          e.target &&
          e.target.closest &&
          e.target.closest(".canvas-footer")
        ) {
          return;
        }
        manualAreaRect = manualArea();
        e.preventDefault();
        e.stopPropagation();
        manualMode.dragging = true;
        const x = e.clientX - manualAreaRect.left;
        const y = e.clientY - manualAreaRect.top;
        manualMode.box = { x0: x, y0: y, x1: x, y1: y };
        showRubberBand();
        refreshRubberBand();
        try {
          mArea.setPointerCapture(e.pointerId);
        } catch (err) {
          /* 合成事件可能抛错，忽略 */
        }
      });
      mArea.addEventListener("pointermove", (e) => {
        if (!manualMode.active || !manualMode.dragging || !manualMode.box)
          return;
        e.preventDefault();
        e.stopPropagation();
        const r = manualAreaRect || manualArea();
        manualMode.box.x1 = e.clientX - r.left;
        manualMode.box.y1 = e.clientY - r.top;
        refreshRubberBand();
      });
      mArea.addEventListener("pointerup", (e) => {
        if (!manualMode.active || !manualMode.dragging) return;
        e.preventDefault();
        e.stopPropagation();
        manualMode.dragging = false;
        hideRubberBand();
        const b = manualMode.box;
        manualMode.box = null;
        if (!b) return;
        // 忽略过小的拖拽（视为点击），避免误触发
        const w = Math.abs(b.x1 - b.x0);
        const h = Math.abs(b.y1 - b.y0);
        if (w < 4 && h < 4) return;
        applyBoxSelection(b);
      });

      // ============ 缝合关系方向详情 ============
      // 核心纯逻辑（sdCore* 前缀）：不依赖 DOM / 全局状态，参数化输入，
      // 供单元测试按函数名从本文件提取后独立运行（单一事实来源）。
      // 端点命名基于顶点注册表：坐标按 0.1mm 聚类（与人工缝合顶点归并约定一致），
      // 相同坐标的端点共享同一顶点名/ID，从而忠实反映后端数据模型中的连接拓扑。

      function sdCoreRoundCoord(v) {
        const n = Number(v);
        return Number.isFinite(n) ? Math.round(n * 10) / 10 : 0;
      }

      // 顶点聚类键：坐标四舍五入到 0.1mm，同键视为同一顶点
      function sdCoreVKey(pt) {
        if (!Array.isArray(pt) || pt.length < 2) return null;
        return sdCoreRoundCoord(pt[0]) + "," + sdCoreRoundCoord(pt[1]);
      }

      // 从裁片边构建顶点注册表：Map<key, {name,id,point}>
      function sdCoreBuildRegistry(panels) {
        const reg = new Map();
        let seq = 0;
        const plist = Array.isArray(panels) ? panels : [];
        for (const p of plist) {
          if (!p || !Array.isArray(p.edges)) continue;
          for (const e of p.edges) {
            if (!e) continue;
            const pts = [e.start_point, e.end_point];
            for (let i = 0; i < pts.length; i++) {
              const key = sdCoreVKey(pts[i]);
              if (!key || reg.has(key)) continue;
              seq++;
              reg.set(key, {
                name: "顶点" + seq,
                id: "v_" + String(seq).padStart(4, "0"),
                point: [
                  sdCoreRoundCoord(pts[i][0]),
                  sdCoreRoundCoord(pts[i][1]),
                ],
              });
            }
          }
        }
        return reg;
      }

      // 规范化缝合关系两侧边：多对多用 edge_sets，否则回退 a_edges/b_edges
      function sdCoreStitchSides(stitch) {
        if (
          stitch &&
          Array.isArray(stitch.edge_sets) &&
          stitch.edge_sets.length
        ) {
          const sides = stitch.edge_sets.map((gs) => {
            if (!gs) return [];
            const ids = gs.edge_ids || gs.edges || [];
            return Array.isArray(ids) ? ids : [];
          });
          return { sides: sides };
        }
        return {
          sides: null,
          a: Array.isArray(stitch && stitch.a_edges) ? stitch.a_edges : [],
          b: Array.isArray(stitch && stitch.b_edges) ? stitch.b_edges : [],
        };
      }

      // 大边（组合边）提取：以小边组合形成的“大边”为单位组织缝合关系。
      // 多对多用 edge_sets（每条组边 = 一条大边，含聚合起终点/长度）；
      // 老数据回退为 A/B 整侧各合并为一条大边（起终点按成员小边链推断）。
      function sdCoreStitchGroups(stitch) {
        const out = [];
        const s = sdCoreStitchSides(stitch);
        if (s.sides) {
          const total = s.sides.length;
          for (let i = 0; i < total; i++) {
            const gs = stitch && stitch.edge_sets ? stitch.edge_sets[i] : null;
            const side = total === 2 ? (i === 0 ? "A" : "B") : "组" + (i + 1);
            out.push({
              side: side,
              group_ids:
                gs && Array.isArray(gs.group_ids) ? gs.group_ids.slice() : [],
              member_edge_ids: (s.sides[i] || []).slice(),
              start_point:
                gs && Array.isArray(gs.start_point)
                  ? gs.start_point.slice()
                  : null,
              end_point:
                gs && Array.isArray(gs.end_point) ? gs.end_point.slice() : null,
              length:
                gs && Number.isFinite(Number(gs.length))
                  ? Number(gs.length)
                  : null,
            });
          }
        } else {
          const pushSide = (ids, groupIds, side) => {
            if (!Array.isArray(ids) || !ids.length) return;
            out.push({
              side: side,
              group_ids: Array.isArray(groupIds) ? groupIds.slice() : [],
              member_edge_ids: ids.slice(),
              start_point: null,
              end_point: null,
              length: null,
            });
          };
          pushSide(s.a, stitch && stitch.a_groups, "A");
          pushSide(s.b, stitch && stitch.b_groups, "B");
        }
        return out;
      }

      // 大边显示名：优先组合边的 group_ids（如 panel_001.edge_group_002），否则用侧别
      function sdCoreGroupLabel(g) {
        if (g && Array.isArray(g.group_ids) && g.group_ids.length) {
          return g.group_ids.join("+");
        }
        return (g && g.side) + "侧";
      }

      // 从成员小边链推断整条大边起终点：首条小边起点 + 末条小边终点（假设边链有序）
      function sdCoreChainExtremes(garment, memberEdgeIds) {
        if (!Array.isArray(memberEdgeIds) || !memberEdgeIds.length) return null;
        const first = sdCoreEdgeInfo(garment, memberEdgeIds[0], null);
        const last = sdCoreEdgeInfo(
          garment,
          memberEdgeIds[memberEdgeIds.length - 1],
          null,
        );
        if (!first || !last) return null;
        return {
          start_point:
            first.start && Array.isArray(first.start.point)
              ? first.start.point.slice()
              : null,
          end_point:
            last.end && Array.isArray(last.end.point)
              ? last.end.point.slice()
              : null,
        };
      }

      // 缝合关系涉及的全部小边（去重、保持顺序），带所属大边侧别标签
      function sdCoreStitchEdges(stitch) {
        const out = [];
        const seen = new Set();
        const push = (id, side) => {
          if (!id || seen.has(id)) return;
          seen.add(id);
          out.push({ edge_id: id, side: side });
        };
        for (const g of sdCoreStitchGroups(stitch)) {
          for (const id of g.member_edge_ids) push(id, g.side);
        }
        return out;
      }

      // 方向文本统一格式：从 {起点端点名称} ({起点端点ID}) 到 {终点端点名称} ({终点端点ID})
      function sdCoreFormatDirection(startName, startId, endName, endId) {
        return (
          "从 " +
          startName +
          " (" +
          startId +
          ") 到 " +
          endName +
          " (" +
          endId +
          ")"
        );
      }

      // 坐标显示文本
      function sdCoreFmtCoord(pt) {
        if (!Array.isArray(pt) || pt.length < 2) return "—";
        const f = (v) => {
          const n = Number(v);
          return Number.isFinite(n) ? n.toFixed(1) : "?";
        };
        return "(" + f(pt[0]) + ", " + f(pt[1]) + ")";
      }

      // 解析单条边：在 garment.panels 内查找并解析两端顶点
      function sdCoreEdgeInfo(garment, edgeId, reg) {
        if (!garment || !Array.isArray(garment.panels)) return null;
        for (const p of garment.panels) {
          if (!p || !Array.isArray(p.edges)) continue;
          for (const e of p.edges) {
            if (!e || e.edge_id !== edgeId) continue;
            const startKey = sdCoreVKey(e.start_point);
            const endKey = sdCoreVKey(e.end_point);
            const sv = startKey && reg ? reg.get(startKey) : null;
            const ev = endKey && reg ? reg.get(endKey) : null;
            const start = {
              name: sv ? sv.name : "未知顶点",
              id: sv ? sv.id : edgeId + "@start",
              point: e.start_point || null,
            };
            const end = {
              name: ev ? ev.name : "未知顶点",
              id: ev ? ev.id : edgeId + "@end",
              point: e.end_point || null,
            };
            return {
              edge_id: edgeId,
              panel_id: p.panel_id || "",
              panel_role: p.role || "",
              role: e.role || "",
              length: Number(e.length) || 0,
              start: start,
              end: end,
              direction: sdCoreFormatDirection(
                start.name,
                start.id,
                end.name,
                end.id,
              ),
            };
          }
        }
        return null;
      }

      // 解析端点为可展示对象：优先命中顶点注册表，否则返回“未知顶点”
      function sdCoreResolvePoint(reg, key, fallbackId, point) {
        const v = key && reg ? reg.get(key) : null;
        return {
          name: v ? v.name : "未知顶点",
          id: v ? v.id : fallbackId,
          point: point && Array.isArray(point) ? point.slice() : null,
        };
      }

      // 解析一条大边（组合边）：起终点优先用聚合端点，缺省时按成员小边链推断
      function sdCoreGroupInfo(garment, g, reg) {
        const needChain =
          !Array.isArray(g.start_point) || !Array.isArray(g.end_point);
        const chain = needChain
          ? sdCoreChainExtremes(garment, g.member_edge_ids)
          : null;
        const startPt = Array.isArray(g.start_point)
          ? g.start_point
          : chain && chain.start_point;
        const endPt = Array.isArray(g.end_point)
          ? g.end_point
          : chain && chain.end_point;
        let role = "";
        let panel_id = "";
        let panel_role = "";
        if (g.member_edge_ids && g.member_edge_ids[0]) {
          const firstEdge = sdCoreEdgeInfo(garment, g.member_edge_ids[0], reg);
          if (firstEdge) {
            role = firstEdge.role;
            panel_id = firstEdge.panel_id;
            panel_role = firstEdge.panel_role;
          }
        }
        const start = sdCoreResolvePoint(
          reg,
          sdCoreVKey(startPt),
          g.side + "@start",
          startPt,
        );
        const end = sdCoreResolvePoint(
          reg,
          sdCoreVKey(endPt),
          g.side + "@end",
          endPt,
        );
        return {
          side: g.side,
          label: sdCoreGroupLabel(g),
          group_ids: g.group_ids,
          member_edge_ids: g.member_edge_ids.slice(),
          length: g.length,
          role: role,
          panel_id: panel_id,
          panel_role: panel_role,
          start: start,
          end: end,
          direction: sdCoreFormatDirection(
            start.name,
            start.id,
            end.name,
            end.id,
          ),
        };
      }

      // 数据验证：方向信息与后端数据模型连接逻辑的一致性校验
      function sdCoreValidateDirection(stitch, garment, reg, edges) {
        const errors = [];
        const warnings = [];
        if (!stitch || typeof stitch !== "object") {
          return { valid: false, errors: ["缝合关系数据为空"], warnings: [] };
        }
        const list = sdCoreStitchEdges(stitch);
        // 1) 边存在性 + 端点坐标/顶点注册
        const edgeMap = new Map();
        if (garment && Array.isArray(garment.panels)) {
          for (const p of garment.panels) {
            if (!p || !Array.isArray(p.edges)) continue;
            for (const e of p.edges) {
              if (e && e.edge_id) edgeMap.set(e.edge_id, e);
            }
          }
        }
        for (const it of list) {
          const e = edgeMap.get(it.edge_id);
          if (!e) {
            errors.push(
              "边 " +
                it.edge_id +
                "（" +
                it.side +
                "侧）在 Garment 数据中不存在",
            );
            continue;
          }
          const sk = sdCoreVKey(e.start_point);
          const ek = sdCoreVKey(e.end_point);
          if (!sk || !ek) {
            errors.push("边 " + it.edge_id + " 端点坐标缺失");
          } else {
            if (!reg || !reg.get(sk))
              warnings.push("边 " + it.edge_id + " 起点未在顶点注册表中登记");
            if (!reg || !reg.get(ek))
              warnings.push("边 " + it.edge_id + " 终点未在顶点注册表中登记");
          }
        }
        // 2) point_matches 引用校验（后端连接逻辑的核心载体）
        const pm = stitch.point_matches;
        if (Array.isArray(pm)) {
          const ids = new Set(list.map((x) => x.edge_id));
          pm.forEach((m, i) => {
            const a = m && m.a;
            const b = m && m.b;
            if (!a || !b) {
              errors.push("point_matches[" + i + "] 缺少 a/b 端点引用");
              return;
            }
            if (!ids.has(a.edge_id))
              errors.push(
                "point_matches[" +
                  i +
                  "] 引用边 " +
                  a.edge_id +
                  " 不在该缝合关系中",
              );
            if (!ids.has(b.edge_id))
              errors.push(
                "point_matches[" +
                  i +
                  "] 引用边 " +
                  b.edge_id +
                  " 不在该缝合关系中",
              );
            if (a.endpoint !== "start" && a.endpoint !== "end")
              errors.push(
                "point_matches[" + i + "] a.endpoint 非法值：" + a.endpoint,
              );
            if (b.endpoint !== "start" && b.endpoint !== "end")
              errors.push(
                "point_matches[" + i + "] b.endpoint 非法值：" + b.endpoint,
              );
            const ae = edgeMap.get(a.edge_id);
            const be = edgeMap.get(b.edge_id);
            if (ae) {
              const key =
                a.endpoint === "start"
                  ? sdCoreVKey(ae.start_point)
                  : sdCoreVKey(ae.end_point);
              if (!key || !reg || !reg.get(key))
                errors.push("point_matches[" + i + "] a 侧端点坐标无法解析");
            }
            if (be) {
              const key =
                b.endpoint === "start"
                  ? sdCoreVKey(be.start_point)
                  : sdCoreVKey(be.end_point);
              if (!key || !reg || !reg.get(key))
                errors.push("point_matches[" + i + "] b 侧端点坐标无法解析");
            }
          });
        }
        // 3) 链式拓扑：同侧组边应形成开链/闭环（端点多出超过 2 个视为异常）
        function chainTerminals(ids) {
          const cnt = new Map();
          for (const id of ids) {
            const e = edgeMap.get(id);
            if (!e) continue;
            for (const k of [
              sdCoreVKey(e.start_point),
              sdCoreVKey(e.end_point),
            ]) {
              if (!k) continue;
              cnt.set(k, (cnt.get(k) || 0) + 1);
            }
          }
          let single = 0;
          for (const c of cnt.values()) if (c === 1) single++;
          return single;
        }
        const sides = sdCoreStitchSides(stitch);
        const checkSide = (ids, label) => {
          const t = chainTerminals(ids);
          if (t > 2)
            warnings.push(
              label +
                "侧 " +
                ids.length +
                " 条边的端点未成链（游离端点数 " +
                t +
                "）",
            );
        };
        if (sides.sides) {
          sides.sides.forEach((ids, i) => checkSide(ids, "组" + (i + 1)));
        } else {
          checkSide(sides.a, "A");
          checkSide(sides.b, "B");
        }
        return {
          valid: errors.length === 0,
          errors: errors,
          warnings: warnings,
        };
      }

      // 构建缝合关系方向详情数据（主入口，纯函数）
      function sdCoreBuildDirectionData(stitch, garment, registry) {
        const reg = registry || sdCoreBuildRegistry(garment && garment.panels);
        // 以大边（组合边）为单位组织方向详情；缺失成员边的组合边保留空占位
        const groups = sdCoreStitchGroups(stitch).map((g) =>
          sdCoreGroupInfo(garment, g, reg),
        );
        // 扁平化得到全部小边（供校验用）
        const edges = sdCoreStitchEdges(stitch).map((it) => {
          const info = sdCoreEdgeInfo(garment, it.edge_id, reg);
          return info
            ? {
                edge_id: it.edge_id,
                side: it.side,
                missing: false,
                role: info.role,
                panel_id: info.panel_id,
                panel_role: info.panel_role,
                length: info.length,
                start: info.start,
                end: info.end,
                direction: info.direction,
              }
            : {
                edge_id: it.edge_id,
                side: it.side,
                missing: true,
                role: "",
                panel_id: "",
                start: null,
                end: null,
                direction: "从 未知 到 未知",
              };
        });
        return {
          stitch_id: (stitch && stitch.stitch_id) || "",
          relation: (stitch && (stitch.relation || stitch.type)) || "seam",
          type: (stitch && stitch.type) || "seam",
          groups: groups,
          edges: edges,
          validation: sdCoreValidateDirection(stitch, garment, reg, edges),
        };
      }

      // ---------- 界面层：状态、缓存与渲染 ----------
      let selectedStitchId = null; // 当前选中查看方向的缝合关系
